name: Quartz G83 regression execution
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/quartz-rust-g83.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Resolve toolchain and dependencies
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          rustup toolchain install 1.85.1 --profile minimal
          rustc +1.85.1 -Vv > evidence/toolchain.txt
          cargo +1.85.1 generate-lockfile --manifest-path rust/quartz/Cargo.toml
          cp rust/quartz/Cargo.lock evidence/Cargo.lock
      - name: Execute independently attributed suites
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          run_suite() {
            name="$1"; shift
            cargo +1.85.1 test --release --locked --manifest-path rust/quartz/Cargo.toml "$@" -- --nocapture > "evidence/$name.log" 2>&1
            rc=$?
            printf '%s\n' "$rc" > "evidence/$name.exit"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          }
          run_suite library --lib
          run_suite g64-integrated --test g64_integrated
          run_suite g77-reference --test g77_reference
          run_suite g82-current --test g82_reconciled
          # Historical failures remain visible and cannot be mistaken for current results.
          cargo +1.85.1 test --release --locked --manifest-path rust/quartz/Cargo.toml --test g74_reconciled -- --nocapture > evidence/g74-historical.log 2>&1
          printf '%s\n' "$?" > evidence/g74-historical.exit
          printf '%s\n' "$failed" > evidence/current-suite-exit.txt
          exit "$failed"
      - name: Hash evidence
        if: always()
        run: |
          if [ -d evidence ]; then (cd evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS); fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quartz-g83-regression-evidence
          path: evidence/

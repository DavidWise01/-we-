name: Quartz Rust G5
on:
  push:
    paths:
      - 'rust/quartz/**'
      - '.github/workflows/quartz-rust-g5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --manifest-path rust/quartz/Cargo.toml
      - run: rustup target add wasm32-unknown-unknown --toolchain stable
      - run: cargo +stable build --manifest-path rust/quartz/Cargo.toml --target wasm32-unknown-unknown --release

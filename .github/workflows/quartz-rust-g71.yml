name: Quartz G71 interrupted recovery
on:
  push:
    paths:
      - 'rust/quartz/**'
      - '.github/workflows/quartz-rust-g71.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.1 --profile minimal
      - name: Capture interruption evidence
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          rustc +1.85.1 -Vv > evidence/toolchain.txt
          set +e
          cargo +1.85.1 test --manifest-path rust/quartz/Cargo.toml --test g71_interruption -- --nocapture 2>&1 | tee evidence/g71.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > evidence/exit.txt
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quartz-g71-interruption-evidence
          path: evidence/

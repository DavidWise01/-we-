<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-197</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:700px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button,select{padding:10px;margin:4px;color:white;background:#233c50;border:1px solid #65dfc3;border-radius:6px}output{display:block;padding:14px}</style><h1>WAG-197 · Intermittent persistence</h1><svg id="v" viewBox="0 0 340 295"></svg><label>Release hold <select id="hold"><option>1</option><option selected>8</option><option>32</option></select></label><button onclick="step(900,96)">+96 signal</button><button onclick="step(-900,96)">−96 signal</button><button onclick="step(0,32)">Gap 32</button><button onclick="step(0,128)">Gap 128</button><button onclick="step(0,256)">Gap 256</button><button onclick="reset()">Reset</button><output id="o"></output><p>Deterministic fixed-point estimator, constant stimulus companion. .dlw</p><script>const e=id=>document.getElementById(id),Q=[8,32,128],H=[5000,15000,30000],colors=['#65dfc3','#9876df','#ff9a42'];let c,p,age,s,quiet,n,commits,releases,history;function step(d,k){for(let i=0;i<k;i++){c=c.map((v,j)=>Math.sign(v)*Math.floor(Math.abs(v)*(Q[j]-1)/Q[j])+d);if(s){quiet=c.every((v,j)=>s*v<H[j]/2)?quiet+1:0;if(quiet>=+e('hold').value){s=quiet=0;releases++}}if(!s){if(!p){let j=c.findIndex((v,j)=>Math.abs(v)>=H[j]);if(j>=0){p=Math.sign(c[j]);age=0}}if(p){if(age>=3&&c.filter((v,j)=>p*v>=H[j]).length>=2){s=p;p=age=quiet=0;commits++}else if(age>=64||p*c[0]<0)p=age=0;else age++}}history.push(s);n++}draw()}function reset(){c=[0,0,0];p=age=s=quiet=n=commits=releases=0;history=[];draw()}function draw(){let z='';for(let j=0;j<3;j++){let r=48+j*30;z+='<circle cx="170" cy="125" r="'+r+'" fill="none" stroke="'+colors[j]+'" stroke-width="2"/><circle cx="170" cy="125" r="'+r+'" fill="none" stroke="'+colors[j]+'" stroke-width="6" stroke-dasharray="'+(2*Math.PI*r*Math.min(1,Math.abs(c[j])/H[j]))+' '+(2*Math.PI*r)+'" transform="rotate(-90 170 125)"/>'}let a=history.slice(-256);z+='<polyline points="'+a.map((v,i)=>(20+i*300/255)+','+(263-v*15)).join(' ')+'" stroke="#65dfc3" stroke-width="2" fill="none"/><circle cx="170" cy="125" r="35" fill="#367e89"/><text x="170" y="122" fill="white" text-anchor="middle">{{i}}</text><text x="170" y="142" fill="white" text-anchor="middle">'+s+'</text>';e('v').innerHTML=z;e('o').textContent='n '+n+' | state '+s+' | commitments '+commits+' | releases '+releases+' | release timer '+quiet}e('hold').onchange=reset;reset()</script></html>

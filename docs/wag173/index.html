<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-173</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button,select{padding:10px;margin:4px;background:#234358;color:white;border:1px solid #65dfc3;border-radius:6px}output{display:block;padding:12px}</style><h1>WAG-173 · Persistence through perturbation</h1><svg id="v" viewBox="0 0 340 340"></svg><label>Gap <select id="gap"><option>0</option><option selected>0.01</option><option>0.05</option><option>0.20</option></select></label><button onclick="advance(1)">Advance</button><button onclick="advance(-1)">Reverse</button><button onclick="advance(173)">+173</button><button onclick="reset()">Reset</button><output id="o"></output><p>Bright/dark coordinates. Browser floating point; Python exact fractions. Changing the gap resets the orbit.</p><footer>.dlw</footer><script>let x,n;const e=id=>document.getElementById(id),E=[[0,1],[2,3],[1,2],[3,4]];function mix(i,j,c,s){let a=x[i],b=x[j];x[i]=c*a-s*b;x[j]=s*a+c*b}function advance(k){let t=+e('gap').value,c=(1-t*t)/(1+t*t),s=2*t/(1+t*t);for(let z=0;z<Math.abs(k);z++){if(k<0){for(let i=0;i<5;i++)mix(i,i+5,c,-s);for(let [i,j] of [...E].reverse())mix(i,j,.6,-.8)}else{for(let [i,j] of E)mix(i,j,.6,.8);for(let i=0;i<5;i++)mix(i,i+5,c,s)}n+=Math.sign(k)}draw()}function draw(){let z='';for(let i=0;i<5;i++){let y=45+i*62;z+='<path d="M60 '+y+'H280" stroke="#567a91"/>';for(let j of [i,i+5]){let u=j<5?60:280;z+='<circle cx="'+u+'" cy="'+y+'" r="'+(12+26*Math.abs(x[j]))+'" fill="'+(j<5?'#ed9439':'#9276e2')+'"/><text x="'+u+'" y="'+(y+4)+'" text-anchor="middle" fill="white" font-size="11">'+x[j].toFixed(3)+'</text>'}}e('v').innerHTML=z+'<circle cx="170" cy="170" r="34" fill="#367f86"/><text x="170" y="175" fill="white" text-anchor="middle">{{i}}</text><text x="60" y="12" fill="#ed9439" text-anchor="middle">BRIGHT</text><text x="280" y="12" fill="#9276e2" text-anchor="middle">DARK</text>';e('o').textContent='Iteration '+n+' | rank retention '+(100*(x[0]**2+x[5]**2)).toFixed(6)+'% | norm² '+x.reduce((a,b)=>a+b*b,0).toFixed(12)}function reset(){x=Array(10).fill(0);x[5]=1;n=0;draw()}e('gap').onchange=reset;reset()</script>

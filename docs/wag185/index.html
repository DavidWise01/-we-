<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-185</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button,select{padding:10px;margin:4px}output{display:block;padding:12px}</style><h1>WAG-185 · Elastic homeostasis</h1><svg id="v" viewBox="0 0 340 330"></svg><select id="m"><option value="0">Rigid</option><option value=".005">0.5%</option><option value=".01">1%</option><option value=".025">2.5%</option><option value="1">Free</option><option value="echo">Echo</option></select><button onclick="advance(1)">Advance</button><button onclick="advance(185)">+185</button><button onclick="reset()">Reset</button><output id="o"></output><p>Floating-point illustrative fixture; exact Python experiment in repository. .dlw</p><script>let x,n,f;const e=id=>document.getElementById(id),E=[[0,1],[2,3],[1,2],[3,4]],ms=x=>Array.from({length:5},(_,i)=>x[i]**2+x[i+5]**2);function mix(y,i,j,c,s){let a=y[i],b=y[j];y[i]=c*a-s*b;y[j]=s*a+c*b}function bright(x){let y=[...x];for(let [i,j] of E)mix(y,i,j,.6,.8);return y}function gap(x,s){let y=[...x];for(let i=0;i<5;i++)mix(y,i,i+5,399/401,s[i]*40/401);return y}function advance(k){for(let z=0;z<k;z++){let b=bright(x),m=e('m').value,p=Array(5).fill((-1)**n),a=ms(bright(gap(b,p))),floor=Math.min(...a);if(m!=='echo')for(let i of n%2?[4,3,2,1,0]:[0,1,2,3,4]){let alt=[...p];alt[i]*=-1;let c=ms(bright(gap(b,alt)));if(c[i]>a[i]+1e-15){if(Math.min(...c)<floor-Number(m)-1e-15){f++;continue}p=alt;a=c}}x=gap(b,p);n++}draw()}function reset(){x=[6,1,-2,1,0,8,-1,2,0,1];let d=Math.hypot(...x);x=x.map(v=>v/d);n=f=0;draw()}function draw(){let z='',a=ms(x);for(let i=0;i<5;i++){let y=35+i*64;z+='<path d="M60 '+y+'H280" stroke="#567a91"/><text x="170" y="'+(y-8)+'" text-anchor="middle" fill="#65dfc3">'+(100*a[i]).toFixed(1)+'%</text>';for(let j of [i,i+5]){let u=j<5?60:280;z+='<circle cx="'+u+'" cy="'+y+'" r="'+(12+26*Math.abs(x[j]))+'" fill="'+(j<5?'#ed9439':'#9276e2')+'"/><text x="'+u+'" y="'+(y+4)+'" text-anchor="middle" fill="white" font-size="11">'+x[j].toFixed(3)+'</text>'}}e('v').innerHTML=z+'<circle cx="170" cy="165" r="28" fill="#367f86"/><text x="170" y="170" fill="white" text-anchor="middle">{{i}}</text>';e('o').textContent='Step '+n+' | origin '+(100*a[0]).toFixed(4)+'% | floor '+(100*Math.min(...a)).toFixed(4)+'% | norm² '+a.reduce((a,b)=>a+b,0).toFixed(9)+' | blocked '+f}e('m').onchange=reset;reset()</script>

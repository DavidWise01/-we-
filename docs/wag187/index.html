<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-187</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}input{width:100%}svg{width:100%}h1{color:#65dfc3}</style><h1>WAG-187 · Directional elasticity</h1><svg id="v" viewBox="0 0 340 240"></svg><label>Previous imbalance <input id="p" type="range" min="0" max="100" value="75"></label><label>Current imbalance <input id="b" type="range" min="0" max="100" value="60"></label><p id="o"></p><p>Illustrative response function, not a trajectory simulation. Exact experiment in Python. .dlw</p><script>function draw(){let a=+document.getElementById('p').value/100,b=+document.getElementById('b').value/100,d=b-a,t=Math.floor(25*Math.max(0,Math.min(1,1-b-d)))/10;let z='';for(let j=-8;j<=8;j++){let path='';for(let k=0;k<=180;k++){let q=k*Math.PI/90,u=j*(1+t),r=94+u*Math.cos(q/2);path+=(k?'L':'M')+(170+r*Math.cos(q))+' '+(115+.7*r*Math.sin(q)-u*Math.sin(q/2))}z+='<path d="'+path+'" fill="none" stroke="'+(j<0?'#9276df':'#ed9439')+'"/>'}document.getElementById('v').innerHTML=z+'<circle cx="170" cy="115" r="34" fill="#367f86"/><text x="170" y="119" text-anchor="middle" fill="white">{{i}}</text>';document.getElementById('o').textContent='ΔB '+(100*d).toFixed(1)+' pp | tolerance '+t.toFixed(1)+'% | '+(d>0?'CONTRACT':d<0?'EXPAND':'HOLD')}document.getElementById('p').oninput=document.getElementById('b').oninput=draw;draw()</script>

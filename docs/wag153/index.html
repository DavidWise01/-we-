<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-153</title><style>body{background:#101827;color:#e9f4ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:10px;margin:4px}pre{white-space:pre-wrap}</style><h1>WAG-153 · Dual counterrotation</h1><svg id="v" viewBox="0 0 340 340"></svg><button id="next">Iterate</button><button id="sweep">360 iterations</button><button id="reset">Reset</button><pre id="out"></pre><p>Symbolic resource accounting, not physical energy. Diffusion is unpriced.</p><footer>.dlw</footer><script>const C=[-1,-2,-3,-4,-5,5,4,3,2,1],E=[];for(let r=1;r<=5;r++)E.push([-r,r]);for(let s of [-1,1])for(let r=1;r<5;r++)E.push([s*r,s*(r+1)]);let x,n,b;function step(){let y={...x},ad=n%360,g=.5+Math.min(ad,360-ad)/360,k=Math.min(g/20,b/40);for(let [a,c] of E){let f=g*Math.min(Math.abs(a),Math.abs(c))/40*(x[a]-x[c]);y[a]-=f;y[c]+=f}for(let i=0;i<10;i++)for(let d of [-1,1]){let a=C[i],c=C[(i+d+10)%10],f=k*x[a];y[a]-=f;y[c]+=f}x=y;b=Math.max(0,b-40*k);n++}function draw(){let z='<circle cx="170" cy="170" r="130" fill="none" stroke="#ed9439" stroke-width="3"/><circle cx="170" cy="170" r="110" fill="none" stroke="#9976ee" stroke-width="3"/>';for(let i=0;i<10;i++){let a=2*Math.PI*i/10,r=C[i];z+='<circle cx="'+(170+120*Math.cos(a))+'" cy="'+(170+120*Math.sin(a))+'" r="'+(8+Math.sqrt(x[r])*4)+'" fill="'+(r<0?'#9976ee':'#ed9439')+'"/>'}document.querySelector('#v').innerHTML=z+'<circle cx="170" cy="170" r="30" fill="#367f86"/><text x="170" y="175" text-anchor="middle" fill="white">{{i}}</text>';document.querySelector('#out').textContent='Iteration '+n+' | ad '+n%360+' | reserve '+b.toFixed(4)+' | spent '+(540-b).toFixed(4)+' | total '+(6+Object.values(x).reduce((a,c)=>a+c,0)).toFixed(8)}function reset(){x=Object.fromEntries(C.map(a=>[a,a===-5?8:a===5?12:0]));n=0;b=540;draw()}document.querySelector('#next').onclick=()=>{step();draw()};document.querySelector('#sweep').onclick=()=>{for(let i=0;i<360;i++)step();draw()};document.querySelector('#reset').onclick=reset;reset()</script>

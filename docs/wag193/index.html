<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-193</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg,input{width:100%}button{padding:10px;margin:4px;background:#234358;color:white;border:1px solid #65dfc3;border-radius:6px}output{display:block;padding:12px}</style><h1>WAG-193 · Nested temporal perception</h1><svg id="v" viewBox="0 0 340 280"></svg><label>Observation (pp)<input id="d" type="range" min="-.5" max=".5" step=".01" value=".15"></label><button onclick="step(8,1)">Shock</button><button onclick="step(+e('d').value,1)">Observe</button><button onclick="step(+e('d').value,5)">+5</button><button onclick="step(+e('d').value,64)">+64</button><button onclick="reset()">Reset</button><output id="o"></output><p>Exact fixed-point estimator companion, not amplitude simulation. .dlw</p><script>const e=id=>document.getElementById(id),Q=[8,32,128],H=[5000,15000,30000],colors=['#65dfc3','#9876df','#ff9a42'];let a,c,n,events,last;function step(v,k){for(let i=0;i<k;i++){let d=Math.round(v*10000),h=Math.max(1000,Math.min(50000,2*a));last=[];if(Math.abs(d)>=h)last=['immediate'];else{c=c.map((z,j)=>Math.sign(z)*Math.floor(Math.abs(z)*(Q[j]-1)/Q[j])+d);last=Q.filter((q,j)=>Math.abs(c[j])>=H[j])}if(last.length){events++;c=[0,0,0]}let r=Math.abs(d)>a?2:32;a=Math.floor(((r-1)*a+Math.abs(d))/r);n++}draw()}function reset(){a=10000;c=[0,0,0];n=events=0;last=[];draw()}function draw(){let z='';for(let j=0;j<3;j++){let r=48+j*31;z+='<circle cx="170" cy="126" r="'+r+'" stroke="'+colors[j]+'" stroke-width="2" fill="none" opacity=".7"/><circle cx="170" cy="126" r="'+r+'" stroke="'+colors[j]+'" stroke-width="7" stroke-dasharray="'+(2*Math.PI*r*Math.abs(c[j])/H[j])+' '+(2*Math.PI*r)+'" transform="rotate(-90 170 126)" fill="none"/><text x="'+(170+r)+'" y="126" fill="'+colors[j]+'" font-size="10">'+Q[j]+'</text>'}e('v').innerHTML=z+'<circle cx="170" cy="126" r="34" fill="#367f86"/><text x="170" y="130" text-anchor="middle" fill="white">{{i}}</text>';e('o').textContent='Observations '+n+' | fast '+(c[0]/10000).toFixed(3)+' | medium '+(c[1]/10000).toFixed(3)+' | slow '+(c[2]/10000).toFixed(3)+' pp | responses '+events+' | last '+last.join(',')}reset()</script></html>

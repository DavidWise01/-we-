<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-191</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg,input{width:100%}button{background:#234358;color:white;padding:12px;border:1px solid #65dfc3;margin:4px}output{display:block;padding:12px}</style><h1>WAG-191 · Persistent sensitivity</h1><svg id="v" viewBox="0 0 340 270"></svg><label>Signed disturbance (pp)<input id="d" type="range" min="-8" max="8" step=".05" value=".35"></label><button onclick="step(+e('d').value)">Observe</button><button onclick="step(8)">Shock</button><button onclick="reset()">Reset</button><output id="o"></output><p>Integer estimator demonstration. .dlw</p><script>const e=id=>document.getElementById(id);let a,c,n,events;function h(){return Math.max(1000,Math.min(50000,2*a))}function step(v){let d=Math.round(v*10000),alarm=false;if(Math.abs(d)>=h()){alarm=true;c=0}else{c+=d;if(Math.abs(c)>=30000){alarm=true;c=0}}if(alarm)events++;let q=Math.abs(d)>a?2:32;a=Math.floor(((q-1)*a+Math.abs(d))/q);n++;draw()}function reset(){a=10000;c=n=events=0;draw()}function draw(){let z='';for(let j=-12;j<=12;j++){let p='';for(let k=0;k<=180;k++){let t=k*Math.PI/90,u=j*2,r=100+u*Math.cos(t/2);p+=(k?'L':'M')+(170+r*Math.cos(t))+' '+(125+.76*r*Math.sin(t)-u*Math.sin(t/2))}z+='<path d="'+p+'" fill="none" opacity=".55" stroke="'+(j<0?'#9876df':'#ff9a42')+'"/>'}e('v').innerHTML=z+'<circle cx="170" cy="125" r="38" fill="#367f86"/><text x="170" y="120" fill="white" text-anchor="middle">{{i}}</text><text x="170" y="139" fill="white" text-anchor="middle" font-size="11">'+(c/10000).toFixed(2)+' pp</text><rect x="50" y="245" width="240" height="12" fill="#34495e"/><rect x="'+(c<0?170+c/250:170)+'" y="245" width="'+Math.abs(c)/250+'" height="12" fill="#65dfc3"/>';e('o').textContent='Observations '+n+' | next immediate threshold '+(h()/10000).toFixed(3)+' pp | cumulative '+(c/10000).toFixed(3)+' pp | events '+events}reset()</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAG-200</title><style>body{background:#101827;color:#e7f5ff;font:16px system-ui;max-width:720px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button,select{padding:12px;margin:4px;color:white;background:#233b50;border:1px solid #65dfc3;border-radius:4px}output{display:block;padding:12px}small{color:#aabdd0}</style><h1>WAG-200 · Continuous homeostasis</h1><svg id="v" viewBox="0 0 340 320"></svg><select id="mode"><option>continuous</option><option>outage</option><option>immediate</option></select><div><button onclick="advance(900,96)">+96</button><button onclick="advance(-900,96)">−96</button><button onclick="advance(0,256)">Quiet ×256</button><button onclick="advance(null,64)">Missing ×64</button><button onclick="advance(900,8)">+8</button><button onclick="advance(-900,8)">−8</button><button onclick="reset()">Reset</button></div><output id="o"></output><small>Exact fixed-point estimator companion. Unknown is not neutral. .dlw</small><script>// WAG-200 — continuous observational homeostasis .dlw
const Q=[8,32,128], H=[5000,15000,30000];
function initial(){return {c:[0,0,0],s:0,p:0,age:0,quiet:0,fresh:[],reacq:false,o:null,n:0}}
function step(old,d,mode='continuous'){
 const z={...old,c:[...old.c],fresh:[...old.fresh],n:old.n+1};
 if(d===null){z.reacq=true;z.fresh=[];z.o=null;return z}
 z.c=z.c.map((v,j)=>Math.trunc(v*(Q[j]-1)/Q[j])+d);
 if(z.s){
  z.quiet=z.c.every((v,j)=>2*z.s*v<H[j])?z.quiet+1:0;
  if(z.quiet>=8)z.s=z.quiet=0;
 }
 if(!z.s){
  if(!z.p){let j=z.c.findIndex((v,j)=>Math.abs(v)>=H[j]);if(j>=0){z.p=Math.sign(z.c[j]);z.age=0}}
  if(z.p){
   if(z.age>=3&&z.c.filter((v,j)=>z.p*v>=H[j]).length>=2){z.s=z.p;z.p=z.age=z.quiet=0}
   else if(z.age>=64||z.p*z.c[0]<0)z.p=z.age=0;
   else z.age++;
  }
 }
 z.fresh=[...z.fresh,d].slice(-8);
 const qualified=z.fresh.length===8&&(z.s?z.fresh.filter(v=>z.s*v>=200).length>=6:z.fresh.every(v=>Math.abs(v)<200));
 if(mode==='outage'){if(z.reacq&&qualified)z.reacq=false;z.o=z.reacq?null:z.s}
 else if(mode==='continuous'){z.o=qualified?z.s:null;z.reacq=!qualified}
 else z.o=z.s;
 if(![-1,0,1].includes(z.s)||z.age>64||z.quiet>=8)throw Error('state bounds');
 return z;
}
function fixture(seed){
 let x=seed>>>0;
 function rand(){x=(Math.imul(x,1664525)+1013904223)>>>0;return x}
 const sign=seed%2?1:-1, a=[];
 const sig=(n,s,name)=>{for(let i=0;i<n;i++)a.push([s*(700+rand()%401),s,name])};
 const quiet=(n,name)=>{for(let i=0;i<n;i++)a.push([Number(rand()%201)-100,0,name])};
 sig(96,sign,'initial');quiet(256,'quiet');sig(96,-sign,'restart');
 for(let i=0;i<64;i++)a.push([null,null,'missing']);
 sig(96,sign,'reverse_after_gap');
 for(let i=0;i<64;i++)a.push([i%2?900:-900,0,'alternating']);
 sig(96,-sign,'reverse_live');quiet(256,'final_quiet');
 return a;
}
function experiment(){
 const rows=[];let count=0, symmetry=0, missingChecks=0;
 for(const mode of ['immediate','outage','continuous']){
  const stats={};
  for(let seed=200;seed<232;seed++){
   let z=initial(),mirror=initial();
   for(const [d,target,name] of fixture(seed)){
    const prev=z;z=step(z,d,mode);mirror=step(mirror,d===null?null:-d,mode);count++;
    if(z.s!==-mirror.s||z.o!==(mirror.o===null?null:-mirror.o)||z.c.some((v,j)=>v!==-mirror.c[j]))throw Error('sign symmetry');
    symmetry++;
    if(d===null){if(z.s!==prev.s||z.c.some((v,j)=>v!==prev.c[j])||z.o!==null)throw Error('missing invariant');missingChecks++}
    let r=stats[name]??={slots:0,correct:0,wrong:0,unknown:0};r.slots++;
    if(z.o===null)r.unknown++;else if(z.o===target)r.correct++;else r.wrong++;
   }
  }
  for(const [phase,r] of Object.entries(stats))rows.push({mode,phase,...r});
 }
 return {count,symmetry,missingChecks,rows};
}
if(typeof module!=='undefined')module.exports={initial,step,fixture,experiment};
if(typeof require!=='undefined'&&typeof module!=='undefined'&&require.main===module)console.log(JSON.stringify(experiment(),null,2));

const e=id=>document.getElementById(id);let z=initial();function advance(d,n){for(let i=0;i<n;i++)z=step(z,d,e('mode').value);draw()}function reset(){z=initial();draw()}function draw(){let a='';for(let j=-12;j<=12;j++){let p='';for(let k=0;k<=180;k++){let t=k*Math.PI/90,u=j*1.7,r=105+u*Math.cos(t/2);p+=(k?'L':'M')+(170+r*Math.cos(t))+' '+(140+.75*r*Math.sin(t)-u*Math.sin(t/2))}a+='<path d="'+p+'" stroke="'+(j<0?'#9876df':'#ff9a42')+'" fill="none" opacity=".3"/>'}for(let j=0;j<3;j++){let r=48+j*30,col=['#65dfc3','#9876df','#ff9a42'][j];a+='<circle cx="170" cy="140" r="'+r+'" stroke="'+col+'" stroke-width="2" opacity=".6" fill="none"/><circle cx="170" cy="140" r="'+r+'" stroke="'+col+'" stroke-width="7" fill="none" stroke-dasharray="'+(2*Math.PI*r*Math.min(1,Math.abs(z.c[j])/H[j]))+' '+2*Math.PI*r+'" transform="rotate(-90 170 140)"/>'}for(let j=0;j<8;j++){let v=z.fresh[j];a+='<rect x="'+(24+j*37)+'" y="282" width="30" height="20" rx="3" fill="'+(v===undefined?'#435466':v>=200?'#ff9a42':v<=-200?'#9876df':'#65dfc3')+'"/>'}e('v').innerHTML=a+'<circle cx="170" cy="140" r="39" fill="#245c68" stroke="'+(z.o===null?'#adb5c5':'#65dfc3')+'" stroke-width="3"/><text x="170" y="135" fill="white" text-anchor="middle">{{i}}</text><text x="170" y="155" font-size="12" fill="white" text-anchor="middle">'+(z.o===null?'UNKNOWN':z.o)+'</text>';e('o').textContent='Slot '+z.n+' | stored '+z.s+' | qualified '+(z.o===null?'unknown':z.o)+' | fresh '+z.fresh.length+'/8'}e('mode').onchange=reset;reset()</script></html>

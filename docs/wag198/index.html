<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-198</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button,select{padding:12px;margin:4px;color:white;background:#234358;border:1px solid #65dfc3;border-radius:6px}output{display:block;padding:12px}</style><h1>WAG-198 · Silence is not absence</h1><svg id="v" viewBox="0 0 340 280"></svg><select id="mode"><option>qualified</option><option>freeze</option><option>zero</option></select><button onclick="step(900,96)">+96 signal</button><button onclick="step(-900,96)">−96 signal</button><button onclick="step(0,256)">Measured zero +256</button><button onclick="step(null,256)">Missing +256</button><button onclick="reset()">Reset</button><output id="o"></output><p>Fixed-point estimator demonstration. Unknown is not neutral. .dlw</p><script>const e=id=>document.getElementById(id),Q=[8,32,128],H=[5000,15000,30000];let c,p,age,s,quiet,n,unknown;function step(d,k){for(let i=0;i<k;i++){n++;unknown=d===null&&e('mode').value==='qualified';if(d===null&&e('mode').value!=='zero')continue;let x=d??0;c=c.map((v,j)=>Math.sign(v)*Math.floor(Math.abs(v)*(Q[j]-1)/Q[j])+x);if(s){quiet=c.every((v,j)=>s*v<H[j]/2)?quiet+1:0;if(quiet>=8)s=quiet=0}if(!s){if(!p){let j=c.findIndex((v,j)=>Math.abs(v)>=H[j]);if(j>=0){p=Math.sign(c[j]);age=0}}if(p){if(age>=3&&c.filter((v,j)=>p*v>=H[j]).length>=2){s=p;p=age=quiet=0}else if(age>=64||p*c[0]<0)p=age=0;else age++}}}draw()}function reset(){c=[0,0,0];p=age=s=quiet=n=0;unknown=false;draw()}function draw(){let z='';for(let j=0;j<3;j++){let r=48+j*30,col=['#65dfc3','#9876df','#ff9a42'][j];z+='<circle cx="170" cy="137" r="'+r+'" stroke="'+col+'" stroke-width="2" fill="none"/><circle cx="170" cy="137" r="'+r+'" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+(2*Math.PI*r*Math.min(1,Math.abs(c[j])/H[j]))+' '+(2*Math.PI*r)+'" transform="rotate(-90 170 137)" fill="none" opacity="'+(unknown?.3:1)+'"/>'}e('v').innerHTML=z+'<circle cx="170" cy="137" r="37" fill="#367e89"/><text x="170" y="132" fill="white" text-anchor="middle">{{i}}</text><text x="170" y="152" fill="white" text-anchor="middle">'+(unknown?'UNKNOWN':s)+'</text>';e('o').textContent='Slots '+n+' | stored '+s+' | output '+(unknown?'unknown':s)}e('mode').onchange=reset;reset()</script>

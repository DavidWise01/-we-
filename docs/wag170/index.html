<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-170</title><style>body{font:16px system-ui;background:#101827;color:#edf5ff;max-width:650px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:12px;margin:4px;background:#24465a;color:white;border:1px solid #65dfc3;border-radius:6px}</style><h1>WAG-170 · Coupled SeeCsaW</h1><svg id="v" viewBox="0 0 340 270"></svg><button onclick="step(false)">Forward</button><button onclick="step(true)">Reverse</button><button onclick="reset()">Reset</button><p id="o"></p><p>Browser floating-point simulation. Python uses exact fractions. Fixed center is external.</p><footer>.dlw</footer><script>let x,n;function rot(p,k){return k===1?[-p[1],p[0]]:[p[1],-p[0]]}function step(rev){if(!rev)x=x.map((p,i)=>rot(p,i<5?-1:1));for(let i=0;i<5;i++){let j=9-i,a=x[i],b=x[j],s=rev?-.8:.8;x[i]=a.map((u,k)=>.6*u-s*b[k]);x[j]=b.map((u,k)=>s*a[k]+.6*u)}if(rev)x=x.map((p,i)=>rot(p,i<5?1:-1));n+=rev?-1:1;draw()}function norm(a){return a.reduce((s,p)=>s+p[0]**2+p[1]**2,0)}function draw(){let z='';for(let i=0;i<5;i++){let y=35+i*49;z+='<path d="M65 '+y+'H275" stroke="#588498" stroke-width="2"/>';for(let j of [i,9-i]){let u=j<5?65:275;z+='<circle cx="'+u+'" cy="'+y+'" r="'+(9+Math.sqrt(norm([x[j]]))*13)+'" fill="'+(j<5?'#9976ee':'#ed9439')+'"/><text x="'+u+'" y="'+(y+4)+'" text-anchor="middle" fill="white">'+(j<5?-(5-i):5-i)+'</text>'}}document.getElementById('v').innerHTML=z+'<circle cx="170" cy="133" r="30" fill="#367f86"/><text x="170" y="138" fill="white" text-anchor="middle">{{i}}</text>';document.getElementById('o').textContent='Step '+n+' | negative '+norm(x.slice(0,5)).toFixed(6)+' | positive '+norm(x.slice(5)).toFixed(6)+' | total '+norm(x).toFixed(6)}function reset(){x=Array.from({length:10},(_,i)=>i<5?[1,0]:[0,0]);n=0;draw()}reset()</script>

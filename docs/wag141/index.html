<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-141</title><style>body{background:#0b1724;color:#eaf5ff;font:16px system-ui;max-width:780px;margin:auto;padding:24px}h1{color:#70eacb}label{display:block;padding:10px}svg{width:100%;max-height:320px}output{display:block;padding:18px;font-size:22px}</style><h1>WAG-141 · Resistance vector</h1><label>Witnesses <input id="n" type="range" min="1" max="8" value="3"><span id="nv"></span></label><label>Quorum <input id="q" type="range" min="1" max="3" value="3"><span id="qv"></span></label><label><input id="shared" type="checkbox"> One shared failure domain</label><svg viewBox="0 0 340 230"><g stroke-width="4"><path d="M170 130L305 130" stroke="#ed903c"/><path d="M170 130L35 200" stroke="#43cf9c"/><path d="M170 130L170 15" stroke="#648cff"/></g><g fill="currentColor" font-size="13"><text x="250" y="118">Erasure</text><text x="10" y="220">Availability</text><text x="180" y="25">Certification</text><text x="180" y="150">{{i}}</text></g><g id="dots" fill="#fff"/></svg><output id="out"></output><p>Structural model, not deployed consensus. 10 local Python tests passed.</p><script>const el=id=>document.getElementById(id);function draw(){let n=+el('n').value;el('q').max=n;let q=+el('q').value;el('nv').textContent=n;el('qv').textContent=q;let r=[n,n-q+1,Math.max(0,2*q-n)];if(el('shared').checked)r=r.map(x=>x?1:0);el('out').textContent='R = ('+r.join(', ')+')';let ends=[[305,130],[35,200],[170,15]];el('dots').innerHTML=r.map((v,i)=>'<circle r="7" cx="'+(170+(ends[i][0]-170)*v/n)+'" cy="'+(130+(ends[i][1]-130)*v/n)+'"/>').join('')}for(let id of ['n','q','shared'])el(id).oninput=draw;draw()</script><footer>.dlw</footer></html>

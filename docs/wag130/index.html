<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-130</title><style>body{background:#0b1724;color:#eaf5ff;font:16px system-ui;max-width:780px;margin:auto;padding:24px}h1{color:#70eacb}pre{background:#193047;padding:24px}button{padding:12px;margin:5px;background:#204459;color:white;border:1px solid #70eacb;border-radius:8px}output{display:block;padding:18px}</style><h1>WAG-130 · Historical completeness</h1><pre id="chain"></pre><div id="controls"></div><output id="out"></output><p>Illustrative policy viewer. Actual signature and prefix verification is in the Python test suite.</p><script>for(const [label,history,bound,result] of [['Complete','G0 → G1 → G2 → G3','G3','COMPLETE_THROUGH_BOUND'],['Truncate','G0 → G1 → G2','G3','HOLD_TRUNCATED'],['Fork','G0 → G1* → G2 → G3','G3','HOLD_FORK'],['Extension','G0 → G1 → G2 → G3 → G4','G3','COMPLETE_THROUGH_BOUND'],['Replay old bound','G0 → G1','G1','COMPLETE_THROUGH_BOUND — freshness unknown']]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{document.querySelector('#chain').textContent=history+'\n     W1 · W2 · W3\n     BOUND: '+bound+'\n         {{i}}';document.querySelector('#out').textContent=result};document.querySelector('#controls').append(b)}document.querySelector('button').click()</script></html>

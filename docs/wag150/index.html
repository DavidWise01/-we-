<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-150</title><style>body{background:#101827;color:#e9f4ff;font:16px system-ui;max-width:650px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:10px}pre{white-space:pre-wrap}</style><h1>WAG-150 · Counterrotation</h1><svg id="v" viewBox="0 0 340 340"></svg><button id="next">Iterate</button> <button id="reset">Reset</button><pre id="out"></pre><p>Illustrative floating-point browser viewer; Python uses exact fractions.</p><script>let x,n;function draw(){let s='';for(let r=1;r<=5;r++){s+='<circle cx="170" cy="170" r="'+r*28+'" fill="none" stroke="#526b88"/>';for(let p of [-1,1]){let a=(p*n+r*24+(p<0?180:0))*Math.PI/180;s+='<circle cx="'+(170+r*28*Math.cos(a))+'" cy="'+(170+r*28*Math.sin(a))+'" r="'+(4+x[5+p*r]*2)+'" fill="'+(p<0?'#9277ee':'#ed9439')+'"/>'}}document.querySelector('#v').innerHTML=s+'<circle cx="170" cy="170" r="20" fill="#477e88"/><text x="170" y="175" fill="white" text-anchor="middle">{{i}}</text>';document.querySelector('#out').textContent='Iteration '+n+' | total '+x.reduce((a,b)=>a+b).toFixed(9)+' | center '+x[5]+'\n'+x.map(y=>y.toFixed(5)).join(' | ')}function reset(){x=[0,1,0,3,1,6,3,1,4,3,4];n=0;draw()}document.querySelector('#next').onclick=()=>{for(let r=1;r<=5;r++){let f=r/20*(x[5-r]-x[5+r]);x[5-r]-=f;x[5+r]+=f}n++;draw()};document.querySelector('#reset').onclick=reset;reset()</script><footer>.dlw</footer>

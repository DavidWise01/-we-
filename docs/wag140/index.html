 C —— N</pre><p>Declare which custodians each failure domain can erase.</p><div id="controls"></div><output id="out"></output><script>const rows=[];for(const d of 'ABC'){const l=document.createElement('label');l.append('Domain '+d+' ');const r=[];for(const w of 'HON'){const c=document.createElement('input');c.type='checkbox';c.checked='ABC'.indexOf(d)==='HON'.indexOf(w);c.onchange=draw;l.append(c,w+' ');r.push(c)}rows.push(r);document.querySelector('#controls').append(l)}function draw(){let a=rows.map(r=>r.reduce((m,c,i)=>m|(c.checked?1<<i:0),0));let min=4;for(let m=1;m<8;m++){let u=0,n=0;for(let i=0;i<3;i++)if(m>>i&1){u|=a[i];n++}if(u===7)min=Math.min(min,n)}document.querySelector('#out').textContent=min===4?'HOLD: incomplete dependency model':'Erasure resistance R='+min+' | unanimous availability cut=1'}draw()</script><p>Structural model only; no live infrastructure attestation.</p></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAG-221 · Witness lineage</title><style>:root{color-scheme:dark}body{background:#0b1727;color:#eaf6ff;max-width:900px;margin:auto;padding:24px;font:16px system-ui}h1{color:#65dfc3}svg{width:100%}p{color:#b6cbd9}select,button{background:#283b52;color:white;border:1px solid #65dfc3;padding:10px;margin:4px;border-radius:5px}.panel{background:#172c42;border:1px solid #38536b;padding:15px;line-height:1.8}.muted{font-size:13px;color:#b8c9d7}.tag{color:#ff9a42}.good{color:#65dfc3}</style><h1>WAG-221 · Two streams, trace the roots</h1><p>One underlying stimulus. Two reports. Count independent witnesses only when their acquisition roots differ.</p><svg id="v" viewBox="0 0 740 360"></svg><label>Acquisition condition <select id="kind"><option value="independent_clean">Independent clean</option><option value="shared_copy">Copied stream</option><option value="shared_corruption">Shared corruption</option><option value="independent_disagree">Independent disagreement</option><option value="shared_upstream">Common upstream</option><option value="forged_distinct" selected>Forged distinct roots</option></select></label><label>Period <select id="p"><option>9</option><option>13</option><option>17</option><option selected>23</option></select></label><label>Seed <select id="seed"><option>221</option><option>222</option><option>225</option><option>228</option></select></label><button onclick="draw()">Trace both ancestries</button><div class="panel" id="out"></div><p class="muted">The anchored registry is constructed by the experiment and is not equivalent to hardware-attested sensor provenance. .dlw</p><script>// WAG-221 — independent acquisition and shared-root auditing .dlw
const PERIODS221=[9,13,17,23],KINDS221=['independent_clean','shared_copy','shared_corruption','independent_disagree','shared_upstream','forged_distinct'];
function random221(seed){let x=seed>>>0;return ()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x}}
function source221(p){const a=Array(192).fill(0);for(let i=3;i<192;i+=p)a[i]=1;return a}
function fixture221(p,kind,seed){
 const original=source221(p),A=original.slice(),B=original.slice(),randA=random221(seed+401),randB=random221(seed+809);
 // The latent stimulus is shared; independence concerns acquisition roots, not the observed target.
 const rootA=['sensor-A:'+seed],rootB=['independent_clean','independent_disagree'].includes(kind)?['sensor-B:'+seed]:['sensor-A:'+seed,'relay-B:'+seed];
 if(kind==='shared_corruption'||kind==='shared_upstream')for(let i=0;i<192;i++)if(i%19===0){A[i]=1-A[i];B[i]=A[i]}
 if(kind==='independent_disagree')for(let i=0;i<192;i++)if(i%3===0)B[i]=1-B[i];
 if(kind==='independent_clean')for(let i=0;i<192;i++){if(randA()%97===0)A[i]=1-A[i];if(randB()%97===0)B[i]=1-B[i]}
 const claimedB=kind==='forged_distinct'?['sensor-B:'+seed]:rootB.slice();
 return {A,B,rootA,rootB,claimedB,kind,p,seed};
}
function agree221(A,B){let equal=0;for(let i=0;i<A.length;i++)equal+=Number(A[i]===B[i]);return equal/A.length}
function assess221(f,policy='anchored'){
 const checkedB=policy==='self_reported'?f.claimedB:f.rootB;
 const shared=f.rootA.some(x=>checkedB.includes(x)),agreement=agree221(f.A,f.B);
 const outcome=shared?'SHARED_ROOT':agreement>=.96?'INDEPENDENT_AGREEMENT':'DISAGREEMENT';
 return {outcome,agreement,shared,qualified:outcome==='INDEPENDENT_AGREEMENT',
  rootsChecked:policy==='anchored'?'fixture-root-registry':'self-reported',
  note:'Synthetic acquisition lineage. A fixture registry is NOT real authenticated sensor provenance.'};
}
function experiment221(){
 const rows=[],examples=[],counterexamples=[];let comparisons=0,independentAgreements=0,sharedRejected=0,disagreements=0,forgeriesExposed=0;
 for(const kind of KINDS221){let independent=0,shared=0,disagree=0,wrong=0,selfReportedQualified=0;
  for(const p of PERIODS221)for(let seed=221;seed<229;seed++){
   const f=fixture221(p,kind,seed),r=assess221(f),self=assess221(f,'self_reported');comparisons+=192;
   if(r.outcome==='INDEPENDENT_AGREEMENT'){independent++;independentAgreements++}
   if(r.outcome==='SHARED_ROOT'){shared++;sharedRejected++}
   if(r.outcome==='DISAGREEMENT'){disagree++;disagreements++}
   if(self.qualified)selfReportedQualified++;
   const expected=kind==='independent_clean'?'INDEPENDENT_AGREEMENT':kind==='independent_disagree'?'DISAGREEMENT':'SHARED_ROOT';
   if(r.outcome!==expected){wrong++;if(counterexamples.length<16)counterexamples.push({kind,p,seed,expected,result:r,A:f.A,B:f.B})}
   if(kind==='forged_distinct'&&self.qualified&&!r.qualified)forgeriesExposed++;
   if(seed===221&&p===9)examples.push({kind,p,seed,rootA:f.rootA,rootB:f.rootB,claimedB:f.claimedB,assessment:r,selfReported:self,A:f.A,B:f.B});
  }
  rows.push({kind,runs:32,independent,shared,disagree,wrong,selfReportedQualified});
 }
 return {comparisons,independentAgreements,sharedRejected,disagreements,forgeriesExposed,rows,examples,counterexamples};
}
if(typeof module!=='undefined')module.exports={fixture221,assess221,experiment221};
if(typeof require!=='undefined'&&require.main===module)console.log(JSON.stringify(experiment221(),null,2));

const el=id=>document.getElementById(id);
function draw(){const kind=el('kind').value,p=+el('p').value,seed=+el('seed').value,f=fixture221(p,kind,seed),r=assess221(f),s=assess221(f,'self_reported');
el('out').innerHTML='<b>Observed agreement:</b> '+(r.agreement*100).toFixed(2)+'%<div>Self-reported conclusion: '+s.outcome+'</div><div class="'+(r.qualified?'good':'tag')+'">Fixture-root conclusion: '+r.outcome+'</div><div>A root: '+f.rootA.join(', ')+'</div><div>B claimed: '+f.claimedB.join(', ')+'</div><div>B fixture ancestry: '+f.rootB.join(', ')+'</div>';
let svg='<rect width="740" height="360" fill="#0b1727"/>';const shared=r.shared;
svg+='<circle cx="132" cy="122" r="70" fill="#263154" stroke="#9876df" stroke-width="3"/><circle cx="609" cy="122" r="70" fill="#493526" stroke="#ff9a42" stroke-width="3"/>';
svg+='<path d="M201 122 Q370 '+(shared?220:36)+' 540 122" stroke="'+(shared?'#ff9a42':'#65dfc3')+'" stroke-width="4" fill="none" stroke-dasharray="'+(shared?'0':'8 6')+'"/>';
svg+='<circle cx="370" cy="170" r="53" fill="#245c68" stroke="#65dfc3" stroke-width="3"/>';
svg+='<text x="132" y="126" text-anchor="middle" font-size="20" fill="white">SENSOR A</text><text x="609" y="126" text-anchor="middle" font-size="20" fill="white">SENSOR B</text><text x="370" y="174" text-anchor="middle" font-size="27" fill="white">{{i}}</text>';
for(let w=0;w<2;w++){let g=w?f.B:f.A,c=w?'#ff9a42':'#9876df',y=278+w*45;svg+='<text x="12" y="'+(y-4)+'" font-size="12" fill="'+c+'">'+(w?'B':'A')+'</text>';for(let i=0;i<192;i++)if(g[i])svg+='<rect x="'+(40+i*665/192)+'" y="'+y+'" width="4" height="25" fill="'+c+'"/>'}
svg+='<text x="370" y="27" text-anchor="middle" font-size="14" fill="#65dfc3">'+(shared?'SHARED ACQUISITION ROOT':r.outcome)+'</text>';el('v').innerHTML=svg}
draw();</script></html>

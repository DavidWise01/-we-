<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-151</title><style>body{background:#101827;color:#e9f4ff;font:16px system-ui;max-width:700px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:10px;margin:4px}pre{white-space:pre-wrap}</style><h1>WAG-151 · Inter-field induction</h1><svg id="v" viewBox="0 0 340 220"></svg><button id="s">Iterate</button><button id="s30">30 iterations</button><button id="reset">Reset</button><pre id="out"></pre><p>Floating-point companion to exact-rational Python. Symbolic exchange, not physical induction.</p><script>let x,n;const nodes=[-5,-4,-3,-2,-1,1,2,3,4,5],edges=[];for(let r=1;r<=5;r++)edges.push([-r,r]);for(let s of [-1,1])for(let r=1;r<5;r++)edges.push([s*r,s*(r+1)]);let p=a=>[40+(5-Math.abs(a))*65,a<0?45:175];function draw(){let s='';for(let [a,b] of edges){let [u,v]=p(a),[w,z]=p(b);s+='<path d="M'+u+' '+v+'L'+w+' '+z+'" stroke="#53798d" fill="none"/>'}for(let a of nodes){let [u,v]=p(a);s+='<circle cx="'+u+'" cy="'+v+'" r="'+(6+Math.sqrt(x[a])*5)+'" fill="'+(a<0?'#9976ee':'#ed9439')+'"/><text x="'+u+'" y="'+(v+4)+'" fill="white" font-size="10" text-anchor="middle">'+a+'</text>'}document.querySelector('#v').innerHTML=s+'<circle cx="170" cy="110" r="19" fill="#367f86"/><text x="170" y="114" fill="white" text-anchor="middle">{{i}}</text>';document.querySelector('#out').textContent='ad '+n%360+'° | iteration '+n+' | total '+(6+Object.values(x).reduce((a,b)=>a+b,0)).toFixed(9)+' | max error '+Math.max(...Object.values(x).map(v=>Math.abs(v-2))).toFixed(8)}function step(){let y={...x},a=n%360,g=.5+Math.min(a,360-a)/360;for(let [u,v] of edges){let f=g*Math.min(Math.abs(u),Math.abs(v))/40*(x[u]-x[v]);y[u]-=f;y[v]+=f}x=y;n++}function reset(){x=Object.fromEntries(nodes.map(a=>[a,a===-5?8:a===5?12:0]));n=0;draw()}document.querySelector('#s').onclick=()=>{step();draw()};document.querySelector('#s30').onclick=()=>{for(let i=0;i<30;i++)step();draw()};document.querySelector('#reset').onclick=reset;reset()</script><footer>.dlw</footer>

    {{i}}</pre><button id="yes">Commit relay</button><button id="no">Withdraw consent</button><button id="fresh">New proposal</button><button id="reset">Reset</button><output id="out"></output><p>Illustrative ordering model. Actual Ed25519 and SQLite checks run in Python.</p><footer>.dlw</footer><script>let closed=false,n=0,spent=0;const e=id=>document.getElementById(id);function draw(m){e('out').textContent=m+' | receipts '+n+' | inventory 26 | spent '+spent}function close(kind){if(closed||spent){draw('HOLD: stale or no surplus');return}closed=true;n++;if(kind==='COMMIT')spent=2;draw(kind)}e('yes').onclick=()=>close('COMMIT');e('no').onclick=()=>close('WITHDRAW');e('fresh').onclick=()=>{closed=false;draw('NEW PROPOSAL: fresh consent required')};e('reset').onclick=()=>{closed=false;n=spent=0;draw('REQUEST')};draw('REQUEST')</script></html>

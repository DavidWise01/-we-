<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-171</title><style>body{font:16px system-ui;background:#101827;color:#edf5ff;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:12px;margin:4px}output{display:block;padding:12px}</style><h1>WAG-171 · Staggered spinor resonance</h1><svg id="v" viewBox="0 0 340 330"></svg><button onclick="step(false)">Advance</button><button onclick="step(true)">Reverse</button><button onclick="reset()">Reset</button><output id="o"></output><p>Browser floating-point companion to exact-rational Python. The central reference is fixed.</p><footer>.dlw</footer><script>let x,n;const R=Array.from({length:5},(_,i)=>[i,9-i]),L=[0,2,5,7].map(i=>[i,i+1]),M=[1,3,6,8].map(i=>[i,i+1]);function rot(s){x=x.map(([a,b],i)=>{let k=s*(i>=5?1:-1);return [-k*b,k*a]})}function mix(E,s){for(let [i,j] of E){let a=x[i],b=x[j];x[i]=a.map((u,k)=>.6*u-s*.8*b[k]);x[j]=b.map((u,k)=>s*.8*a[k]+.6*u)}}function step(rev){if(rev){mix(M,-1);mix(L,-1);mix(R,-1);rot(-1)}else{rot(1);mix(R,1);mix(L,1);mix(M,1)}n+=rev?-1:1;draw()}const norm=p=>p[0]**2+p[1]**2,pos=i=>[i<5?65:275,35+(i<5?i:9-i)*65];function draw(){let z='';for(let [i,j] of [...R,...L,...M]){let [a,b]=pos(i),[c,d]=pos(j);z+='<path d="M'+a+' '+b+'L'+c+' '+d+'" stroke="#638b9d" stroke-width="2"/>'}for(let i=0;i<10;i++){let [a,b]=pos(i),v=norm(x[i]);z+='<circle cx="'+a+'" cy="'+b+'" r="'+(9+36*Math.sqrt(v))+'" fill="'+(i<5?'#9976ee':'#ed9439')+'"/><text x="'+a+'" y="'+(b+4)+'" text-anchor="middle" font-size="10" fill="white">'+v.toFixed(3)+'</text>'}document.getElementById('v').innerHTML=z+'<circle cx="170" cy="165" r="31" fill="#367f86"/><text x="170" y="170" fill="white" text-anchor="middle">{{i}}</text>';document.getElementById('o').textContent='Step '+n+' | norm² '+x.reduce((a,p)=>a+norm(p),0).toFixed(12)}function reset(){x=Array.from({length:10},(_,i)=>[i===0?1:0,0]);n=0;draw()}reset()</script>

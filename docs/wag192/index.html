<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-192</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg,input{width:100%}button,select{padding:10px;margin:4px}output{display:block;padding:12px}</style><h1>WAG-192 · Perceptual permeability</h1><svg id="v" viewBox="0 0 340 250"></svg><label>Memory <select id="q"><option value="128">127/128</option><option value="32">31/32</option><option value="8">7/8</option><option value="1">0</option><option value="0">1</option></select></label><label>Disturbance (pp)<input id="d" type="range" min="-0.5" max=".5" step=".01" value=".05"></label><button onclick="step(8,1)">Shock</button><button onclick="step(+e('d').value,1)">Observe</button><button onclick="step(+e('d').value,64)">+64</button><button onclick="reset()">Reset</button><output id="o"></output><p>Integer estimator simulation. .dlw</p><script>const e=id=>document.getElementById(id);let a,c,n,events;function step(v,k){for(let i=0;i<k;i++){let d=Math.round(v*10000),h=Math.max(1000,Math.min(50000,2*a)),q=+e('q').value;if(Math.abs(d)>=h){events++;c=0}else{if(q)c=Math.sign(c)*Math.floor(Math.abs(c)*(q-1)/q);c+=d;if(Math.abs(c)>=30000){events++;c=0}}let r=Math.abs(d)>a?2:32;a=Math.floor(((r-1)*a+Math.abs(d))/r);n++}draw()}function reset(){a=10000;c=n=events=0;draw()}function draw(){let z='';for(let j=-12;j<=12;j++){let p='';for(let k=0;k<=180;k++){let t=k*Math.PI/90,u=j*2,r=100+u*Math.cos(t/2);p+=(k?'L':'M')+(170+r*Math.cos(t))+' '+(115+.7*r*Math.sin(t)-u*Math.sin(t/2))}z+='<path d="'+p+'" fill="none" opacity=".55" stroke="'+(j<0?'#9876df':'#ff9a42')+'"/>'}e('v').innerHTML=z+'<circle cx="170" cy="115" r="38" fill="#367f86"/><text x="170" y="110" text-anchor="middle" fill="white">{{i}}</text><text x="170" y="130" font-size="11" text-anchor="middle" fill="white">'+(c/10000).toFixed(3)+' pp</text><rect x="50" y="232" width="240" height="12" fill="#456075"/><rect x="'+(c<0?170+c/250:170)+'" y="232" width="'+Math.abs(c)/250+'" height="12" fill="#65dfc3"/>';e('o').textContent='Observations '+n+' | memory '+(c/10000).toFixed(4)+' pp | responses '+events}e('q').onchange=reset;reset()</script>

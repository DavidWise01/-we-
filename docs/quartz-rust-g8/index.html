<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quartz G8 · Rust WASM</title>
<style>body{background:#10101c;color:#eee;font:16px system-ui;max-width:1000px;margin:auto;padding:1rem}h1{color:#d89aff}a{color:#75eaff}canvas{width:100%;height:auto;background:#17172a;border:1px solid #8250bf}button,input,textarea{font:inherit;margin:.3rem;padding:.5rem}textarea{width:95%;height:9rem;background:#202033;color:#fff}button:disabled{opacity:.45}#status{color:#ffbc70}</style>
<h1>Quartz G8 · Rust observational shadow</h1><p>125 cells · 300 edges · 24 slots · 3 pumps · 1 constant · .dlw</p>
<p id="status" role="status">Loading compiled Rust module…</p><canvas id="view" width="900" height="530"></canvas>
<div><label>Shell cell <input id="cell" type="number" min="0" max="124" value="0"></label><label>Damage <input id="damage" type="number" min="0" max="100" value="40"></label><button id="shock" disabled>Shock</button><button id="recover" disabled>Recover</button><button id="replay" disabled>Replay journal</button><button id="save" disabled>Export journal</button></div><p id="energy"></p><textarea id="journal" aria-label="Canonical journal"></textarea><p>Rotation is a 3D projection; history is the fourth, temporal coordinate. Browser state is computed by Rust, not by JavaScript.</p>
<script type="module">
const $=id=>document.getElementById(id);
const ctx=$('view').getContext('2d');let engine=null,health=null,angle=0;
function draw(){ctx.clearRect(0,0,900,530);if(health){let pts=[];for(let i=0;i<125;i++){let x=i%5-2,y=Math.floor(i/5)%5-2,z=Math.floor(i/25)-2;let a=x*Math.cos(angle)-z*Math.sin(angle),b=x*Math.sin(angle)+z*Math.cos(angle);pts.push([450+75*a,265+65*y+22*b,b]);}ctx.strokeStyle='#58477b';ctx.lineWidth=1;for(let i=0;i<125;i++){for(let d of [1,5,25]){if((d===1&&i%5<4)||(d===5&&Math.floor(i/5)%5<4)||(d===25&&i<100)){ctx.beginPath();ctx.moveTo(...pts[i].slice(0,2));ctx.lineTo(...pts[i+d].slice(0,2));ctx.stroke();}}}for(const i of Array.from({length:125},(_,i)=>i).sort((a,b)=>pts[a][2]-pts[b][2])){ctx.fillStyle=i===62?'#fff':health[i]<100?'#ff673b':'#65e6ea';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(pts[i][0],pts[i][1],i===62?9:4,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;}angle+=.006;requestAnimationFrame(draw);}
draw();
function refresh(){health=engine.health();$('energy').textContent='R / B / G energy: '+Array.from(engine.energy()).join(' / ');$('journal').value=engine.journal();}
function act(fn){try{if(fn()){refresh();$('status').textContent='Rust transition accepted';}else{$('status').textContent='Rejected; previous state preserved';}}catch(e){$('status').textContent=String(e);}}
try{const {default:init,Quartz}=await import('./pkg/quartz_kernel.js');await init();engine=new Quartz(100,100,100);refresh();$('status').textContent='Rust WASM ready';for(const id of ['shock','recover','replay','save'])$(id).disabled=false;$('shock').onclick=()=>act(()=>{let i=Number($('cell').value),d=Number($('damage').value);return Number.isInteger(i)&&Number.isInteger(d)&&i>=0&&i<125&&d>=0&&d<=100&&engine.shock(i,d);});$('recover').onclick=()=>act(()=>engine.recover());$('replay').onclick=()=>act(()=>engine.replay($('journal').value));$('save').onclick=()=>{let url=URL.createObjectURL(new Blob([engine.journal()],{type:'text/plain'}));let a=document.createElement('a');a.href=url;a.download='quartz.qj1';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};}catch(e){$('status').textContent='WASM unavailable: '+e.message+' — controls remain disabled.';}
</script></html>

<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-190</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg,input{width:100%}button{padding:10px;background:#234358;color:white;border:1px solid #65dfc3;border-radius:6px;margin:4px}output{display:block;padding:12px}</style><h1>WAG-190 · Asymmetric adaptation</h1><svg id="v" viewBox="0 0 340 250"></svg><label>Disturbance (pp)<input id="d" type="range" min="-8" max="8" step=".1" value="8"></label><button onclick="step(+e('d').value,1)">Observe</button><button onclick="step(0,32)">32 quiet observations</button><button onclick="reset()">Reset</button><output id="o"></output><p>Estimator response demonstration, not amplitude simulation. .dlw</p><script>const e=id=>document.getElementById(id);let a,b,n;function h(v){return Math.max(1000,Math.min(50000,2*v))/10000}function step(d,k){for(let i=0;i<k;i++){let v=Math.round(Math.abs(d)*10000),q=v>a?2:32;a=Math.floor(((q-1)*a+v)/q);b=Math.floor((7*b+v)/8);n++}draw()}function reset(){a=b=10000;n=0;draw()}function draw(){let z='';for(let j=-11;j<=11;j++){let p='';for(let k=0;k<=180;k++){let t=k*Math.PI/90,u=j*(1+h(a)/2),r=91+u*Math.cos(t/2);p+=(k?'L':'M')+(170+r*Math.cos(t))+' '+(116+.75*r*Math.sin(t)-u*Math.sin(t/2))}z+='<path d="'+p+'" fill="none" opacity=".6" stroke="'+(j<0?'#9276df':'#ed9439')+'"/>'}e('v').innerHTML=z+'<circle cx="170" cy="116" r="34" fill="#367f86"/><text x="170" y="112" text-anchor="middle" fill="white">{{i}}</text><text x="170" y="130" font-size="11" text-anchor="middle" fill="white">'+h(a).toFixed(2)+' pp</text>';e('o').textContent='Observations '+n+' | asymmetric '+h(a).toFixed(4)+' pp | symmetric '+h(b).toFixed(4)+' pp'}reset()</script>

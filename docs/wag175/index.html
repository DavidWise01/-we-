<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-175</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:720px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button,select{padding:10px;margin:4px;background:#234358;color:white;border:1px solid #65dfc3;border-radius:6px}output{display:block;padding:12px}</style><h1>WAG-175 · Harmonic selection</h1><svg id="v" viewBox="0 0 340 340"></svg><label>Reversal interval <select id="h"></select></label><label>Phase <select id="p"><option>1</option><option>-1</option></select></label><button onclick="advance(1)">Advance</button><button onclick="advance(-1)">Reverse</button><button onclick="advance(360)">+360</button><button onclick="reset()">Reset</button><output id="o"></output><p>Browser floating-point model; exact norm and reverse tests in Python. Fixed starting state. .dlw</p><script>let x,n;const e=id=>document.getElementById(id),E=[[0,1],[2,3],[1,2],[3,4]];e('h').innerHTML=[1,2,3,5,8,13,21,34,55,360].map(k=>'<option>'+k+'</option>').join('');function mix(i,j,c,s){let a=x[i],b=x[j];x[i]=c*a-s*b;x[j]=s*a+c*b}function advance(k){for(let z=0;z<Math.abs(k);z++){let s=40/401*+e('p').value*(-1)**Math.floor((k<0?n-1:n)/+e('h').value),c=399/401;if(k<0){for(let i=0;i<5;i++)mix(i,i+5,c,-s);for(let [i,j] of [...E].reverse())mix(i,j,.6,-.8)}else{for(let [i,j] of E)mix(i,j,.6,.8);for(let i=0;i<5;i++)mix(i,i+5,c,s)}n+=Math.sign(k)}draw()}function draw(){let z='';for(let i=0;i<5;i++){let y=45+i*62;z+='<path d="M60 '+y+'H280" stroke="#567a91"/>';for(let j of [i,i+5]){let u=j<5?60:280;z+='<circle cx="'+u+'" cy="'+y+'" r="'+(12+26*Math.abs(x[j]))+'" fill="'+(j<5?'#ed9439':'#9276e2')+'"/><text x="'+u+'" y="'+(y+4)+'" text-anchor="middle" fill="white" font-size="11">'+x[j].toFixed(3)+'</text>'}}e('v').innerHTML=z+'<circle cx="170" cy="170" r="34" fill="#367f86"/><text x="170" y="175" fill="white" text-anchor="middle">{{i}}</text>';e('o').textContent='Step '+n+' | retained '+(100*(x[0]**2+x[5]**2)).toFixed(6)+'% | norm² '+x.reduce((a,b)=>a+b*b,0).toFixed(12)}function reset(){x=Array(10).fill(0);x[5]=1;n=0;draw()}e('h').onchange=e('p').onchange=reset;reset()</script></html>

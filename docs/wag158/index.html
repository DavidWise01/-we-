<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-158</title><style>body{background:#101827;color:#e9f4ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:10px;margin:4px;background:#194654;color:white;border:1px solid #65dfc3;border-radius:6px}pre{white-space:pre-wrap}</style><h1>WAG-158 · Sovereign permeability</h1><p>Toggle consent by clicking a node. Route one inventory unit through consenting balanced fields.</p><svg id="v" viewBox="0 0 340 340"></svg><button id="route">Execute relay</button><button id="reset">Reset</button><pre id="out"></pre><p>Illustrative browser model; Python reference uses exact fractions. Consent is local Boolean state, not authenticated.</p><footer>.dlw</footer><script>let x,b,p,path,d;const e=id=>document.getElementById(id),pos=i=>[170+115*Math.cos(i*Math.PI/5-Math.PI/2),170+115*Math.sin(i*Math.PI/5-Math.PI/2)];function draw(msg){let z='<circle cx="170" cy="170" r="115" stroke="#557c90" fill="none"/>';for(let k=1;k<path.length;k++){let [a,c]=pos(path[k-1]),[u,v]=pos(path[k]);z+='<path d="M'+a+' '+c+'L'+u+' '+v+'" stroke="#65dfc3" stroke-width="5"/>'}for(let i=0;i<10;i++){let [u,v]=pos(i);z+='<g data-i="'+i+'" style="cursor:pointer"><circle cx="'+u+'" cy="'+v+'" r="22" fill="'+(p[i]?'#367f86':'#bf5457')+'"/><text pointer-events="none" x="'+u+'" y="'+(v+4)+'" text-anchor="middle" fill="white">'+x[i]+'</text></g>'}e('v').innerHTML=z+'<circle cx="170" cy="170" r="35" fill="#53657c"/><text x="170" y="175" text-anchor="middle" fill="white">{{i}} · 6</text>';e('v').querySelectorAll('[data-i]').forEach(g=>g.onclick=()=>{p[+g.dataset.i]=!p[+g.dataset.i];path=[];draw('Consent changed')});e('out').textContent=msg+' | spent '+d+' | inventory '+(6+x.reduce((a,c)=>a+c,0))}function route(){let c=[];for(let dir of [1,-1]){let r=[0];if(!p[0]||x[0]<=2)continue;for(let k=1;k<10;k++){let j=(k*dir+10)%10;r.push(j);if(!p[j]||x[j]>2)break;if(x[j]===2)continue;let a=Math.min(x[0]-2,2-x[j],...r.slice(0,-1).map(i=>b[i]));if(a>0)c.push([r,a]);break}}c.sort((a,b)=>a[0].length-b[0].length);if(!c.length){path=[];draw('HOLD: no eligible route');return}let [r,a]=c[0];path=r;x[0]-=a;x[r.at(-1)]+=a;for(let i of r.slice(0,-1))b[i]-=a;d+=a*(r.length-1);draw('Relay accepted')}function reset(){x=[3,2,1,...Array(7).fill(2)];b=Array(10).fill(10);p=Array(10).fill(true);path=[];d=0;draw('Ready')}e('route').onclick=route;e('reset').onclick=reset;reset()</script>

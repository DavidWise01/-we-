<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-154</title><style>body{background:#101827;color:#e9f4ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:10px;margin:4px}pre{white-space:pre-wrap}label{display:block}</style><h1>WAG-154 · Diodic replenishment</h1><svg viewBox="0 0 340 300" id="v"></svg><label>Absorption per iteration <input id="abs" type="range" min="0" max="4" step=".25" value="2"> <span id="av"></span></label><button id="next">Iterate</button><button id="sweep">360 iterations</button><button id="reset">Reset</button><pre id="out"></pre><p>Aggregate resource ledger, not physical energy. Browser uses floating point; Python reference uses exact fractions.</p><footer>.dlw</footer><script>let e,b,d,n;const el=id=>document.getElementById(id);function step(){let a=n%360,g=.5+Math.min(a,360-a)/360,i=Math.min(e,+el('abs').value),j=Math.min(b+i,2*g);e-=i;b+=i-j;d+=j;n++}function draw(){el('av').textContent=el('abs').value;let z='';for(let [i,v,c,t] of [[0,e,'#65dfc3','External'],[1,b,'#a48bea','Internal'],[2,d,'#ed9439','Dissipated']]){let y=30+i*90;z+='<rect x="20" y="'+y+'" width="300" height="48" rx="8" fill="#26354a"/><rect x="20" y="'+y+'" width="'+(300*v/540)+'" height="48" rx="8" fill="'+c+'"/><text x="30" y="'+(y+28)+'" fill="white">'+t+' '+v.toFixed(2)+'</text>'}el('v').innerHTML=z;el('out').textContent='Iteration '+n+' | ad '+n%360+'° | total '+(e+b+d).toFixed(8)}function reset(){e=540;b=d=n=0;draw()}el('abs').oninput=draw;el('next').onclick=()=>{step();draw()};el('sweep').onclick=()=>{for(let i=0;i<360;i++)step();draw()};el('reset').onclick=reset;reset()</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-132</title><style>body{background:#0b1724;color:#eaf5ff;font:16px system-ui;max-width:780px;margin:auto;padding:24px}h1{color:#70eacb}pre{background:#193047;padding:24px}select{padding:10px;margin:5px}output{display:block;padding:18px}</style><h1>WAG-132 · Witness sovereignty</h1><pre id="mesh"></pre><div id="controls"></div><output id="out"></output><p>Declared single-root assignments only; not proof of physical independence. 10 Python tests passed.</p><script>const a=[];function draw(){const v=a.map(s=>s.value);document.querySelector('#mesh').textContent='H ← '+v[0]+'\nO ← '+v[1]+'\nN ← '+v[2]+'\n   {{i}}';document.querySelector('#out').textContent=new Set(v).size===3?'DISJOINT_DECLARED_ROOTS':'HOLD_SHARED_ROOT'}for(const [i,n] of ['H','O','N'].entries()){let s=document.createElement('select');s.setAttribute('aria-label',n+' control root');for(const r of ['A','B','C'])s.add(new Option(n+' ← '+r,r));s.selectedIndex=i;s.onchange=draw;a.push(s);document.querySelector('#controls').append(s)}draw()</script></html>

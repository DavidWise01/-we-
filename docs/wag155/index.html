<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-155</title><style>body{background:#101827;color:#e9f4ff;font:16px system-ui;max-width:700px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:10px;margin:4px;background:#194654;color:white;border:1px solid #65dfc3;border-radius:6px}pre{white-space:pre-wrap}</style><h1>WAG-155 · Distributed homeostatic custody</h1><svg id="v" viewBox="0 0 340 340"></svg><button id="one">+1°</button><button id="many">+90°</button><button id="full">+360°</button><button id="reset">Reset</button><pre id="out"></pre><p>Outer discs: local credit reserves. Inner discs: inventory. Symbolic model; browser floating point, Python exact fractions.</p><footer>.dlw</footer><script>const N=[-1,-2,-3,-4,-5,5,4,3,2,1],e=id=>document.getElementById(id);let x,b,E,D,n;function step(){let a=n%360,g=.5+Math.min(a,360-a)/360,inc=Math.min(E,2);E-=inc;b[5]+=inc;let old=[...b],y=[...x];for(let i=0;i<10;i++){let j=(i+1)%10,f=(old[i]-old[j])/8;b[i]-=f;b[j]+=f}for(let i=0;i<10;i++){let f=Math.min(b[i],g*x[i]/10);b[i]-=f;D+=f;y[i]-=f;y[(i+9)%10]+=f/2;y[(i+1)%10]+=f/2}x=y;n++}function draw(){let z='<circle cx="170" cy="170" r="110" stroke="#557f95" fill="none"/>';for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,u=170+110*Math.cos(a),v=170+110*Math.sin(a);z+='<circle cx="'+u+'" cy="'+v+'" r="'+(14+Math.min(12,Math.sqrt(b[i])*3))+'" fill="none" stroke="#65dfc3" stroke-width="2"/><circle cx="'+u+'" cy="'+v+'" r="'+(8+Math.sqrt(x[i])*3)+'" fill="'+(N[i]<0?'#9976ee':'#ed9439')+'"/><text x="'+u+'" y="'+(v+4)+'" fill="white" text-anchor="middle" font-size="11">'+N[i]+'</text>'}e('v').innerHTML=z+'<circle cx="170" cy="170" r="33" fill="#367f86"/><text x="170" y="174" text-anchor="middle" fill="white">{{i}} · 6</text>';e('out').textContent='Iteration '+n+' | ad '+n%360+'°\nExternal '+E.toFixed(6)+' | local '+b.reduce((a,c)=>a+c,0).toFixed(6)+' | dissipated '+D.toFixed(6)+'\nInventory '+(6+x.reduce((a,c)=>a+c,0)).toFixed(8)+' | resource total '+(E+D+b.reduce((a,c)=>a+c,0)).toFixed(8)}function reset(){x=N.map(a=>a===-5?8:a===5?12:0);b=Array(10).fill(0);E=540;D=n=0;draw()}for(let [id,k] of [['one',1],['many',90],['full',360]])e(id).onclick=()=>{for(let i=0;i<k;i++)step();draw()};e('reset').onclick=reset;reset()</script>

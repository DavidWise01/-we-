<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-142</title><style>body{background:#0b1724;color:#eaf5ff;font:16px system-ui;max-width:800px;margin:auto;padding:24px}h1{color:#70eacb}label{display:block;padding:8px}output{display:block;padding:18px;font-size:24px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #426175;text-align:left}svg{width:100%;max-height:260px}</style><h1>WAG-142 · Anisotropic optimization</h1><label>Population <select id="n"><option>3</option><option>5</option><option>8</option><option selected>13</option></select></label><label>Quorum <input id="q" type="range" min="1" max="13" value="9"><span id="v"></span></label><div id="modes"></div><svg viewBox="0 0 340 240"><path d="M170 135L170 25M170 135L305 205M170 135L35 205" stroke="#647b94" fill="none"/><polygon id="poly" fill="#70eacb" fill-opacity=".25" stroke="#70eacb" stroke-width="2"/><g fill="currentColor" font-size="13"><text x="170" y="15" text-anchor="middle">Certification</text><text x="305" y="225" text-anchor="end">Erasure</text><text x="35" y="225">Availability</text><text x="170" y="151" text-anchor="middle">{{i}}</text></g></svg><output id="out"></output><table><thead><tr><th>q</th><th>R_e</th><th>R_a</th><th>R_f</th><th>Pareto</th></tr></thead><tbody id="rows"></tbody></table><p>Structural model. Each axis can use independent single-witness domains or one common domain. Actual Python engine supports arbitrary overlaps.</p><footer>.dlw</footer><script>const e=id=>document.getElementById(id);for(const a of ['Erasure','Availability','Certification']){let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.onchange=draw;l.append(c,' Shared '+a+' domain');e('modes').append(l)}function draw(){let n=+e('n').value;e('q').max=n;let q=+e('q').value;e('v').textContent=q;let m=[...e('modes').querySelectorAll('input')].map(x=>x.checked);let f=j=>[n,n-j+1,Math.max(0,2*j-n)].map((x,i)=>m[i]&&x?1:x);let r=f(q);e('out').textContent='R = ('+r.join(', ')+')';e('poly').setAttribute('points',(170+135*r[0]/n)+','+(135+70*r[0]/n)+' '+(170-135*r[1]/n)+','+(135+70*r[1]/n)+' 170,'+(135-110*r[2]/n));let all=Array.from({length:n},(_,i)=>f(i+1));e('rows').innerHTML=all.map((r,i)=>'<tr><td>'+(i+1)+'</td>'+r.map(x=>'<td>'+x+'</td>').join('')+'<td>'+(!all.some(s=>s.some((x,j)=>x>r[j])&&s.every((x,j)=>x>=r[j]))?'Yes':'No')+'</td></tr>').join('')}e('n').onchange=draw;e('q').oninput=draw;draw()</script></html>

<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-162</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:12px;margin:4px;color:white;background:#24465a;border:1px solid #65dfc3;border-radius:6px}pre{white-space:pre-wrap}</style><h1>WAG-162 · Localized causal independence</h1><svg id="v" viewBox="0 0 340 300"></svg><button onclick="act('A')">Commit A</button><button onclick="act('B')">Commit B</button><button onclick="act('C')">Commit overlapping C</button><button onclick="reset()">Reset</button><pre id="out"></pre><p>Illustrative local-version model; actual Ed25519 and SQLite tests in Python.</p><footer>.dlw</footer><script>const paths={A:[0,1,2],B:[3,4,5],C:[0,1,2]};let x,b,v,h;function draw(m){let z='<circle cx="170" cy="150" r="105" fill="none" stroke="#6b8da1"/>';for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,u=170+105*Math.cos(a),w=150+105*Math.sin(a);z+='<circle cx="'+u+'" cy="'+w+'" r="21" fill="'+(v[i]?'#278b70':i<3?'#9675df':i<6?'#e99a42':'#53657c')+'"/><text x="'+u+'" y="'+(w+4)+'" fill="white" text-anchor="middle">'+x[i]+'</text>'}document.getElementById('v').innerHTML=z+'<circle cx="170" cy="150" r="36" fill="#367f86"/><text x="170" y="155" fill="white" text-anchor="middle">{{i}} · 6</text>';document.getElementById('out').textContent=m+' | inventory 26 | spent '+(540-b.reduce((a,c)=>a+c,0))+'\n'+h.join('\n')}function act(k){let p=paths[k];if(p.some(i=>v[i])){draw('HOLD: stale footprint');return}x[p[0]]--;x[p[2]]++;b[p[0]]--;b[p[1]]--;for(let i of p)v[i]++;h.push('COMMIT '+k);draw('Accepted '+k)}function reset(){x=[3,2,1,3,2,1,2,2,2,2];b=Array(10).fill(54);v=Array(10).fill(0);h=[];draw('Ready')}reset()</script>

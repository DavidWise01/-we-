<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-152</title><style>body{background:#101827;color:#e9f4ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:10px;margin:4px;background:#194654;color:white;border:1px solid #65dfc3;border-radius:6px}pre{white-space:pre-wrap}</style><h1>WAG-152 · Homeostatic circulation</h1><svg id="v" viewBox="0 0 340 340"></svg><button id="next">+1 arcdegree</button><button id="sweep">Full rotation</button><button id="eq">Equilibrium</button><button id="reset">Disturbance</button><pre id="out"></pre><p>Floating-point viewer; Python reference uses exact fractions. Symbolic driven exchange, not physical perpetual motion.</p><footer>.dlw</footer><script>const C=[-1,-2,-3,-4,-5,5,4,3,2,1],E=[];for(let r=1;r<=5;r++)E.push([-r,r]);for(let s of [-1,1])for(let r=1;r<5;r++)E.push([s*r,s*(r+1)]);let x,n;const p=a=>{let i=C.indexOf(a),t=2*Math.PI*i/10-Math.PI/2;return [170+125*Math.cos(t),170+125*Math.sin(t)]};function step(){let y={...x},ad=n%360,g=.5+Math.min(ad,360-ad)/360;for(let [a,b] of E){let f=g*Math.min(Math.abs(a),Math.abs(b))/40*(x[a]-x[b]);y[a]-=f;y[b]+=f}for(let i=0;i<10;i++){let a=C[i],b=C[(i+1)%10],f=g*x[a]/10;y[a]-=f;y[b]+=f}x=y;n++}function draw(){let s='<defs><marker id="a" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#65dfc3"/></marker></defs>';for(let i=0;i<10;i++){let a=C[i],b=C[(i+1)%10],u=p(a),v=p(b);s+='<path d="M'+u.join(' ')+'L'+v.join(' ')+'" stroke="#65dfc3" stroke-width="2" marker-end="url(#a)" opacity=".7"/>'}for(let a of C){let [u,v]=p(a);s+='<circle cx="'+u+'" cy="'+v+'" r="'+(10+Math.sqrt(x[a])*3)+'" fill="'+(a<0?'#9976ee':'#ed9439')+'"/><text x="'+u+'" y="'+(v+4)+'" text-anchor="middle" fill="white" font-size="12">'+a+'</text>'}document.querySelector('#v').innerHTML=s+'<circle cx="170" cy="170" r="27" fill="#367f86"/><text x="170" y="174" text-anchor="middle" fill="white">{{i}}</text>';document.querySelector('#out').textContent='ad '+n%360+'° | total '+(6+Object.values(x).reduce((a,b)=>a+b,0)).toFixed(9)+' | residual '+Math.max(...Object.values(x).map(v=>Math.abs(v-2))).toExponential(5)+' | cycle flux '+(.5+Math.min(n%360,360-n%360)/360)*2}function reset(eq=false){x=Object.fromEntries(C.map(a=>[a,eq?2:a===-5?8:a===5?12:0]));n=0;draw()}document.querySelector('#next').onclick=()=>{step();draw()};document.querySelector('#sweep').onclick=()=>{for(let i=0;i<360;i++)step();draw()};document.querySelector('#eq').onclick=()=>reset(true);document.querySelector('#reset').onclick=()=>reset();reset()</script></html>

<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-178</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button,select{padding:10px;margin:4px}output{display:block;padding:12px}</style><h1>WAG-178 · Temporal perception</h1><svg id="v" viewBox="0 0 340 330"></svg><select id="rank"></select><select id="kind"><option>dark</option><option>mixed</option></select><select id="policy"><option>derivative</option><option>local</option><option>echo</option></select><button onclick="advance(1)">Advance</button><button onclick="advance(178)">+178</button><button onclick="reset()">Reset</button><output id="o"></output><p>Floating-point companion to exact Python; derivative uses previous pre-gap sample. .dlw</p><script>const e=id=>document.getElementById(id),E=[[0,1],[2,3],[1,2],[3,4]];let x,old,n,p,r;e('rank').innerHTML=Array.from({length:5},(_,i)=>'<option value="'+i+'">Rank '+(i+1)+'</option>').join('');function mix(i,j,c,s){let a=x[i],b=x[j];x[i]=c*a-s*b;x[j]=s*a+c*b}function advance(k){for(let z=0;z<k;z++){for(let [i,j] of E)mix(i,j,.6,.8);let b=[...x],q=e('policy').value==='derivative'&&old?b.map((v,i)=>2*v-old[i]):b;p=Array.from({length:5},(_,i)=>e('policy').value==='echo'?(-1)**n:Math.sign(q[i]*q[i+5])||-p[i]);for(let i=0;i<5;i++)mix(i,i+5,399/401,p[i]*40/401);old=b;n++}draw()}function reset(){r=+e('rank').value;x=Array(10).fill(0);x[r]=e('kind').value==='mixed'?.6:0;x[r+5]=e('kind').value==='mixed'?.8:1;n=0;old=null;p=Array(5).fill(-1);draw()}function draw(){let z='';for(let i=0;i<5;i++){let y=35+i*64;z+='<path d="M60 '+y+'H280" stroke="'+(p[i]<0?'#9276e2':'#ed9439')+'"/>';for(let j of [i,i+5]){let u=j<5?60:280;z+='<circle cx="'+u+'" cy="'+y+'" r="'+(12+26*Math.abs(x[j]))+'" fill="'+(j<5?'#ed9439':'#9276e2')+'"/><text x="'+u+'" y="'+(y+4)+'" text-anchor="middle" fill="white" font-size="11">'+x[j].toFixed(3)+'</text>'}}e('v').innerHTML=z+'<circle cx="170" cy="165" r="28" fill="#367f86"/><text x="170" y="170" fill="white" text-anchor="middle">{{i}}</text>';e('o').textContent='Step '+n+' | retained '+(100*(x[r]**2+x[r+5]**2)).toFixed(4)+'% | norm² '+x.reduce((a,b)=>a+b*b,0).toFixed(9)}e('rank').onchange=e('kind').onchange=e('policy').onchange=reset;reset()</script>

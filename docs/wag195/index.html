<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-195</title><style>body{background:#101827;color:#e7f5ff;font:16px system-ui;max-width:650px;margin:auto;padding:24px}h1{color:#65dfc3}svg,input{width:100%}button{padding:12px;margin:4px;color:white;background:#234358;border:1px solid #65dfc3}output{display:block;padding:12px}</style><h1>WAG-195 · Provisional perception</h1><svg id="v" viewBox="0 0 340 280"></svg><label>Signed observation (pp)<input id="d" type="range" min="-.5" max=".5" step=".01" value=".15"></label><button onclick="step(8,1)">Shock</button><button onclick="step(+e('d').value,1)">Observe</button><button onclick="step(+e('d').value,5)">+5</button><button onclick="step(+e('d').value,64)">+64</button><button onclick="step(0,80)">Quiet +80</button><button onclick="reset()">Reset</button><output id="o"></output><p>Fixed-point estimator; not amplitude simulation. .dlw</p><script>const e=id=>document.getElementById(id),Q=[8,32,128],H=[5000,15000,30000],colors=['#65dfc3','#9876df','#ff9a42'];let a,c,p,age,n,alerts,commits,expired,last;function step(v,k){for(let i=0;i<k;i++){let d=Math.round(v*10000),h=Math.max(1000,Math.min(50000,2*a));last='';if(Math.abs(d)>=h){alerts++;commits++;c=[0,0,0];p=age=0;last='SHOCK'}else{c=c.map((z,j)=>Math.sign(z)*Math.floor(Math.abs(z)*(Q[j]-1)/Q[j])+d);if(!p){let j=c.findIndex((z,j)=>Math.abs(z)>=H[j]);if(j>=0){p=Math.sign(c[j]);age=0;alerts++;last='ALERT'}}if(p){if(age>=3&&c.filter((z,j)=>p*z>=H[j]).length>=2){commits++;p=age=0;c=[0,0,0];last='COMMIT'}else if(age>=64||p*c[0]<0){expired++;p=age=0;c=[0,0,0];last='EXPIRE'}else age++}}let r=Math.abs(d)>a?2:32;a=Math.floor(((r-1)*a+Math.abs(d))/r);n++}draw()}function reset(){a=10000;c=[0,0,0];p=age=n=alerts=commits=expired=0;last='';draw()}function draw(){let z='';for(let j=0;j<3;j++){let r=48+j*31;z+='<circle cx="170" cy="137" r="'+r+'" stroke="'+colors[j]+'" stroke-width="2" fill="none"/><circle cx="170" cy="137" r="'+r+'" stroke="'+colors[j]+'" stroke-width="7" stroke-dasharray="'+(2*Math.PI*r*Math.min(1,Math.abs(c[j])/H[j]))+' '+(2*Math.PI*r)+'" transform="rotate(-90 170 137)" fill="none"/>'}e('v').innerHTML=z+'<circle cx="170" cy="137" r="35" fill="#367f86"/><text x="170" y="134" text-anchor="middle" fill="white">{{i}}</text><text x="170" y="151" font-size="10" text-anchor="middle" fill="white">'+(last||(p?'PENDING':'OBSERVE'))+'</text>';e('o').textContent='n '+n+' | alerts '+alerts+' | commits '+commits+' | expired '+expired+' | pending age '+age}reset()</script></html>

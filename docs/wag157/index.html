<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-157</title><style>body{background:#101827;color:#e9f4ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:10px;margin:4px}pre{white-space:pre-wrap}</style><h1>WAG-157 · Homeostatic permeability</h1><svg id="v" viewBox="0 0 340 340"></svg><button id="next">Relay</button><button id="full">Recover</button><button id="reset">Reset</button><pre id="out"></pre><p>Prefunded symbolic ring. Each forwarding edge costs one credit per unit. Balanced intermediaries retain inventory.</p><footer>.dlw</footer><script>const N=[-1,-2,-3,-4,-5,5,4,3,2,1],e=id=>document.getElementById(id);let x,b,d,n,path;const p=i=>[170+115*Math.cos(i*Math.PI/5-Math.PI/2),170+115*Math.sin(i*Math.PI/5-Math.PI/2)];function step(){path=[];for(let i=0;i<10;i++){if(x[i]<=2)continue;for(let dir of [1,-1]){let route=[i];for(let k=1;k<10;k++){let j=(i+k*dir+10)%10;route.push(j);if(x[j]>2)break;if(x[j]===2)continue;let a=Math.min(x[i]-2,2-x[j],...route.slice(0,-1).map(z=>b[z]));if(a<=0)break;x[i]-=a;x[j]+=a;for(let z of route.slice(0,-1))b[z]-=a;d+=a*(route.length-1);n++;path=route;return true}}}return false}function draw(){let z='<circle cx="170" cy="170" r="115" stroke="#56738a" fill="none"/>';for(let k=1;k<path.length;k++){let [a,c]=p(path[k-1]),[u,v]=p(path[k]);z+='<path d="M'+a+' '+c+'L'+u+' '+v+'" stroke="#65dfc3" stroke-width="5"/>'}for(let i=0;i<10;i++){let [u,v]=p(i);z+='<circle cx="'+u+'" cy="'+v+'" r="20" fill="'+(N[i]<0?'#9976ee':'#ed9439')+'"/><text x="'+u+'" y="'+(v+4)+'" text-anchor="middle" fill="white">'+x[i]+'</text>'}e('v').innerHTML=z+'<circle cx="170" cy="170" r="35" fill="#367f86"/><text x="170" y="175" fill="white" text-anchor="middle">{{i}} · 6</text>';e('out').textContent='Transfers '+n+' | credits spent '+d+' | remaining '+b.reduce((a,c)=>a+c,0)+' | residual '+Math.max(...x.map(a=>Math.abs(a-2)))}function reset(){x=N.map(a=>a===-5?8:a===5?12:0);b=Array(10).fill(54);d=n=0;path=[];draw()}e('next').onclick=()=>{step();draw()};e('full').onclick=()=>{for(let k=0;k<360&&step();k++);draw()};e('reset').onclick=reset;reset()</script>

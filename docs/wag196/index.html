<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-196</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button{padding:12px;margin:4px;color:white;background:#234358;border:1px solid #65dfc3;border-radius:6px}output{display:block;padding:12px}input{width:100%}</style><h1>WAG-196 · Commitment recoverability</h1><svg id="v" viewBox="0 0 340 290"></svg><label>Observation (pp)<input id="d" type="range" min="-.2" max=".2" step=".01" value=".09"></label><button onclick="step(+e('d').value,1)">Observe</button><button onclick="step(.09,96)">Positive +96</button><button onclick="step(-.09,96)">Negative +96</button><button onclick="step(0,256)">Quiet +256</button><button onclick="reset()">Reset</button><output id="o"></output><p>Integer estimator companion, no shock bypass. .dlw</p><script>const e=id=>document.getElementById(id),Q=[8,32,128],H=[5000,15000,30000],colors=['#65dfc3','#9876df','#ff9a42'];let c,p,age,s,quiet,n,events;function step(v,k){for(let i=0;i<k;i++){let d=Math.round(v*10000);c=c.map((z,j)=>Math.sign(z)*Math.floor(Math.abs(z)*(Q[j]-1)/Q[j])+d);if(s){quiet=c.every((z,j)=>s*z<H[j]/2)?quiet+1:0;if(quiet>=8){events.push('release '+s);s=quiet=0}}if(!s){if(!p){let j=c.findIndex((z,j)=>Math.abs(z)>=H[j]);if(j>=0){p=Math.sign(c[j]);age=0}}if(p){if(age>=3&&c.filter((z,j)=>p*z>=H[j]).length>=2){s=p;events.push('commit '+s);p=age=quiet=0}else if(age>=64||p*c[0]<0){p=age=0}else age++}}n++}draw()}function reset(){c=[0,0,0];p=age=s=quiet=n=0;events=[];draw()}function draw(){let z='';for(let j=0;j<3;j++){let r=48+j*31;z+='<circle cx="170" cy="137" r="'+r+'" stroke="'+colors[j]+'" stroke-width="2" fill="none"/><circle cx="170" cy="137" r="'+r+'" stroke="'+colors[j]+'" stroke-width="7" stroke-dasharray="'+(2*Math.PI*r*Math.min(1,Math.abs(c[j])/H[j]))+' '+(2*Math.PI*r)+'" transform="rotate(-90 170 137)" fill="none"/>'}e('v').innerHTML=z+'<line x1="30" y1="'+(137+s*30)+'" x2="310" y2="'+(137-s*30)+'" stroke="#65dfc3" stroke-width="3"/><circle cx="170" cy="137" r="35" fill="#367f86"/><text x="170" y="131" text-anchor="middle" fill="white">{{i}}</text><text x="170" y="150" text-anchor="middle" fill="white">'+s+'</text>';e('o').textContent='Observations '+n+' | state '+s+' | release timer '+quiet+'/8 | transitions '+events.join(', ')}reset()</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-145</title><style>body{background:#0b1724;color:#eaf5ff;font:16px system-ui;max-width:800px;margin:auto;padding:24px}h1{color:#70eacb}label{display:block;padding:8px}output{display:block;padding:20px;font-size:22px}pre{background:#193047;padding:18px;white-space:pre-wrap}</style><h1>WAG-145 · Overlapping compromise geometry</h1><pre>{ STORAGE } — [ AVAILABILITY ] — ( SIGNING )

                    {{i}}</pre><label><input id="shared" type="checkbox" checked> Add shared dependencies</label><div id="axes"></div><output id="out"></output><pre id="cut"></pre><p>13 witnesses, quorum 9. Calculates minimum declared joint cuts locally; structural capability only.</p><footer>.dlw</footer><script>const e=id=>document.getElementById(id);for(let name of ['Erasure','Availability','Certification']){let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.onchange=draw;l.append(c,name);e('axes').append(l)}function draw(){let d=Array.from({length:13},(_,i)=>['host'+i,1<<i,1<<i,1<<i]);if(e('shared').checked)d.push(['provider',0,511,0],['admin',0,0,31],['backup',255,0,0],['recovery',7936,0,992]);let active=[...e('axes').querySelectorAll('input')].map(c=>c.checked),b=99,h=[],count=0;let pop=x=>{let n=0;while(x){x&=x-1;n++}return n};if(!active.some(Boolean)){e('out').textContent='Select at least one axis';e('cut').textContent='';return}for(let m=0;m<(1<<d.length);m++){let k=pop(m);if(k>b)continue;let v=[0,0,0];for(let i=0;i<d.length;i++)if(m>>i&1)for(let j=0;j<3;j++)v[j]|=d[i][j+1];if(active.every((a,j)=>!a||pop(v[j])>=[13,5,5][j])){if(k<b){b=k;h=d.filter((_,i)=>m>>i&1).map(r=>r[0]);count=0}count++}}e('out').textContent='Minimum joint cut: '+b;e('cut').textContent=count+' minimum combinations; example:\n'+h.join(' + ')}e('shared').onchange=draw;draw()</script></html>

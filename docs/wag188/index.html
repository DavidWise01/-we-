<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-188</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:650px;margin:auto;padding:24px}h1{color:#65dfc3}svg,input{width:100%}button{padding:12px}output{display:block;padding:12px}</style><h1>WAG-188 · Hysteretic SeeCsaW</h1><svg viewBox="0 0 340 250" id="v"></svg><label>Change in imbalance (percentage points)<input id="d" type="range" min="-5" max="5" step=".1" value="0"></label><button onclick="advance()">Observe</button><button onclick="s=0;draw()">Reset</button><output id="o"></output><p>Response-function demonstration, not amplitude trajectory. Exact Python experiment in repository. .dlw</p><script>let s=0;const e=id=>document.getElementById(id);function advance(){let d=+e('d').value;s=d>=2?1:d<=-2?-1:Math.abs(d)<=1?0:s*d>0?s:0;draw()}function draw(){let z='';for(let j=-10;j<=10;j++){let p='';for(let k=0;k<=180;k++){let t=k*Math.PI/90,u=j*2,r=100+u*Math.cos(t/2);p+=(k?'L':'M')+(170+r*Math.cos(t))+' '+(120+.7*r*Math.sin(t)-u*Math.sin(t/2))}z+='<path d="'+p+'" fill="none" stroke="'+(j<0?'#9276df':'#ed9439')+'"/>'}e('v').innerHTML=z+'<path d="M50 '+(120-s*24)+'L290 '+(120+s*24)+'" stroke="#65dfc3" stroke-width="4"/><circle cx="170" cy="120" r="35" fill="#367f86"/><text x="170" y="125" fill="white" text-anchor="middle">{{i}}</text>';e('o').textContent='Change '+e('d').value+' pp | '+(s===1?'CONTRACT':s===-1?'EXPAND':'HOLD')}e('d').oninput=draw;draw()</script>

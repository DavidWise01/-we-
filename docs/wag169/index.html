<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-169</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:650px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}input{width:100%}</style><h1>WAG-169 · SeeCsaW Möbius spinors</h1><svg id="v" viewBox="0 0 340 260"></svg><label>Rotation <input id="a" type="range" min="0" max="720" step="180" value="0"></label><output id="o"></output><p>Exact discrete spinor samples; projected Möbius geometry is illustrative.</p><footer>.dlw</footer><script>function draw(){let a=+document.getElementById('a').value,k=a/180,s=[[1,0],[0,1],[-1,0],[0,-1]][k%4],z='';for(let j=-8;j<=8;j++){let d='';for(let i=0;i<=180;i++){let t=i*Math.PI/90,u=j*3,r=100+u*Math.cos(t/2);d+=(i?'L':'M')+(170+r*Math.cos(t))+' '+(120+.65*r*Math.sin(t)-u*Math.sin(t/2))}z+='<path d="'+d+'" stroke="'+(j<0?'#9976ee':'#ed9439')+'" fill="none"/>'}document.getElementById('v').innerHTML=z+'<circle cx="170" cy="120" r="30" fill="#367f86"/><text x="170" y="125" fill="white" text-anchor="middle">{{i}}</text>';document.getElementById('o').textContent=a+'° | spinor ('+s.join(', ')+') | norm² 1'}document.getElementById('a').oninput=draw;draw()</script>

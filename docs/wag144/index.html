<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-144</title><style>body{background:#0b1724;color:#eaf5ff;font:16px system-ui;max-width:800px;margin:auto;padding:24px}h1{color:#70eacb}label{display:block;padding:12px}#mesh{display:flex;flex-wrap:wrap;gap:10px}.host{border:1px solid #70eacb;padding:12px;border-radius:8px}output{display:block;padding:20px;font-size:22px}</style><h1>WAG-144 · Correlated sovereignty</h1><label>Budget <input id="b" type="range" min="21" max="39" step="2" value="29"><span id="v"></span></label><div id="mesh"></div><output id="out"></output><p>Synthetic costs. Each host shares signing custody unless its keys are individually isolated. Structural model, not deployment.</p><script>const e=id=>document.getElementById(id);function* p(n,m){if(!n){yield [];return}for(let k=Math.min(n,m);k>0;k--)for(let t of p(n-k,k))yield [k,...t]}function cut(s,t){if(t<=0)return 0;let a=0,i=0;for(let v of [...s].sort((a,b)=>b-a)){a+=v;i++;if(a>=t)return i}}function draw(){let b=+e('b').value,best=null;e('v').textContent=b;for(let s of p(13,4)){for(let m=0;m<1<<s.length;m++){if(s.some((v,i)=>v===1&&(m>>i&1)))continue;let c=13+2*s.length+s.reduce((a,v,i)=>a+((m>>i&1)?v:0),0);if(c>b)continue;let z=s.flatMap((v,i)=>(m>>i&1)?Array(v).fill(1):[v]);for(let q=1;q<=13;q++){let r=[s.length,cut(s,14-q),cut(z,2*q-13)],score=[Math.min(...r),Math.min(...r.slice(1)),r.reduce((a,b)=>a+b),-c,q];if(!best||score.some((v,i)=>v>best.score[i]&&score.slice(0,i).every((x,j)=>x===best.score[j])))best={s,m,r,q,c,score}}}}e('mesh').replaceChildren();for(let [i,v] of best.s.entries()){let d=document.createElement('div');d.className='host';d.textContent='● '.repeat(v)+' | '+((best.m>>i&1)?v+' keys':'1 custody domain');e('mesh').append(d)}e('out').textContent='R = ('+best.r.join(', ')+') · quorum '+best.q+'/13 · cost '+best.c}e('b').oninput=draw;draw()</script><footer>.dlw</footer></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-199</title><style>body{margin:auto;max-width:720px;padding:24px;background:#101827;color:#e9f4ff;font:16px system-ui}h1{color:#65dfc3}svg{width:100%}button,select{background:#263c50;color:white;border:1px solid #65dfc3;padding:10px;margin:4px;border-radius:6px}output{display:block;padding:12px}small{color:#b8cadb}</style><h1>WAG-199 · Observational reacquisition</h1><svg id="v" viewBox="0 0 340 310"></svg><select id="mode"><option>fresh</option><option>immediate</option></select><button onclick="step(900,96)">+96 signal</button><button onclick="step(-900,96)">−96 signal</button><button onclick="step(null,256)">Missing ×256</button><button onclick="step(900,8)">+8</button><button onclick="step(-900,8)">−8</button><button onclick="step(0,256)">Quiet ×256</button><button onclick="reset()">Reset</button><output id="o"></output><small>Fixed-point estimator companion. .dlw</small><script>const e=id=>document.getElementById(id),Q=[8,32,128],H=[5000,15000,30000],colors=['#65dfc3','#9876df','#ff9a42'];let c,p,age,s,quiet,n,reacq,fresh;function step(d,k){for(let i=0;i<k;i++){n++;if(d===null){reacq=true;fresh=[];continue}c=c.map((v,j)=>Math.sign(v)*Math.floor(Math.abs(v)*(Q[j]-1)/Q[j])+d);if(s){quiet=c.every((v,j)=>s*v<H[j]/2)?quiet+1:0;if(quiet>=8)s=quiet=0}if(!s){if(!p){let j=c.findIndex((v,j)=>Math.abs(v)>=H[j]);if(j>=0){p=Math.sign(c[j]);age=0}}if(p){if(age>=3&&c.filter((v,j)=>p*v>=H[j]).length>=2){s=p;p=age=quiet=0}else if(age>=64||p*c[0]<0)p=age=0;else age++}}if(reacq){fresh=[...fresh,d].slice(-8);if(e('mode').value==='immediate'||fresh.length===8&&(s?fresh.filter(v=>s*v>=200).length>=6:fresh.every(v=>Math.abs(v)<200)))reacq=false}}draw()}function reset(){c=[0,0,0];p=age=s=quiet=n=0;reacq=false;fresh=[];draw()}function draw(){let z='';for(let j=0;j<3;j++){let r=48+j*30;z+='<circle cx="170" cy="137" r="'+r+'" fill="none" stroke="'+colors[j]+'" stroke-width="2" opacity=".5"/><circle cx="170" cy="137" r="'+r+'" fill="none" stroke="'+colors[j]+'" stroke-width="7" stroke-dasharray="'+(2*Math.PI*r*Math.min(1,Math.abs(c[j])/H[j]))+' '+(2*Math.PI*r)+'" transform="rotate(-90 170 137)"/>'}for(let j=0;j<8;j++){let v=fresh[j],col=v===undefined?'#435466':v>=200?'#ff9a42':v<=-200?'#9876df':'#65dfc3';z+='<rect x="'+(42+j*33)+'" y="275" width="25" height="17" rx="3" fill="'+col+'"/>'}e('v').innerHTML=z+'<circle cx="170" cy="137" r="39" fill="#367e89" stroke="'+(reacq?'#adb5c5':'#65dfc3')+'" stroke-width="3"/><text x="170" y="132" fill="white" text-anchor="middle">{{i}}</text><text x="170" y="153" fill="white" font-size="11" text-anchor="middle">'+(reacq?'UNKNOWN':s)+'</text>';e('o').textContent='Slots '+n+' | stored '+s+' | output '+(reacq?'unknown':s)+' | fresh '+fresh.length+'/8'}e('mode').onchange=reset;reset()</script></html>

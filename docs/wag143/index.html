<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-143</title><style>body{background:#0b1724;color:#eaf5ff;font:16px system-ui;max-width:800px;margin:auto;padding:24px}h1{color:#70eacb}label{display:block;padding:12px}#mesh{display:flex;gap:8px;flex-wrap:wrap}.domain{border:1px solid #70eacb;padding:10px;border-radius:7px}.dot{display:inline-block;width:13px;height:13px;background:#ed903c;border-radius:50%;margin:3px}output{display:block;padding:18px;font-size:22px}</style><h1>WAG-143 · Resource-constrained sovereignty</h1><label>Budget <input id="b" type="range" min="13" max="39" value="29"><span id="v"></span></label><div id="mesh"></div><output id="out"></output><p>13 witnesses; synthetic unit costs; maximum four witnesses per domain. Signing keys assumed independently controlled.</p><footer>.dlw</footer><script>const e=id=>document.getElementById(id);function* parts(n,m){if(!n){yield [];return}for(let k=Math.min(n,m);k>0;k--)for(let t of parts(n-k,k))yield [k,...t]}function draw(){let b=+e('b').value;e('v').textContent=b;let best=null;for(let s of parts(13,4)){let c=13+2*s.length;if(c>b)continue;for(let q=1;q<=13;q++){let a=0,t=0;while(t<14-q)t+=s[a++];let r=[s.length,a,Math.max(0,2*q-13)],score=[Math.min(...r),Math.min(...r.slice(1)),r.reduce((a,b)=>a+b,0),-c,q];if(!best||score.some((x,i)=>x>best.score[i]&&score.slice(0,i).every((y,j)=>y===best.score[j])))best={s,q,r,score,c}}}e('mesh').replaceChildren();if(!best){e('out').textContent='INFEASIBLE';return}for(let n of best.s){let d=document.createElement('div');d.className='domain';for(let i=0;i<n;i++){let x=document.createElement('span');x.className='dot';d.append(x)}e('mesh').append(d)}e('out').textContent='R = ('+best.r.join(', ')+') · quorum '+best.q+'/13 · cost '+best.c}e('b').oninput=draw;draw()</script></html>

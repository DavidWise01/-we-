<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WAG-180</title><style>body{background:#101827;color:#edf5ff;font:16px system-ui;max-width:680px;margin:auto;padding:24px}h1{color:#65dfc3}svg{width:100%}button,select{padding:10px;margin:4px}output{display:block;padding:12px}</style><h1>WAG-180 · Perceptual confidence</h1><svg id="v" viewBox="0 0 340 330"></svg><select id="policy"><option>confidence</option><option>echo</option><option>local</option><option>half</option></select><button onclick="advance(1)">Advance</button><button onclick="advance(180)">+180</button><button onclick="reset()">Reset</button><output id="o"></output><p>Illustrative disturbed fixture, floating point; exact seeded experiment in Python. .dlw</p><script>let x,old,older,p,n,count,g;const e=id=>document.getElementById(id),E=[[0,1],[2,3],[1,2],[3,4]];function mix(i,j,c,s){let a=x[i],b=x[j];x[i]=c*a-s*b;x[j]=s*a+c*b}function advance(k){for(let z=0;z<k;z++){for(let [i,j] of E)mix(i,j,.6,.8);let b=[...x],m=e('policy').value;g=Array(5).fill(false);p=p.map((s,i)=>{let j=i+5,use=m==='half'&&old;if(m==='confidence'&&older){let u=[b[i]-old[i],b[j]-old[j]],v=[old[i]-older[i],old[j]-older[j]],dot=u[0]*v[0]+u[1]*v[1],nu=u[0]**2+u[1]**2,nv=v[0]**2+v[1]**2;use=dot>0&&4*dot*dot>=nu*nv&&nu<=4*nv&&nv<=4*nu}g[i]=!!use;count+=!!use;let a=use?3*b[i]-old[i]:b[i],c=use?3*b[j]-old[j]:b[j];return m==='echo'?(-1)**n:Math.sign(a*c)||-s});for(let i=0;i<5;i++)mix(i,i+5,399/401,p[i]*40/401);older=old;old=b;n++}draw()}function reset(){x=[6,1,-2,1,0,8,-1,2,0,1];let d=Math.hypot(...x);x=x.map(v=>v/d);old=older=null;p=Array(5).fill(-1);g=Array(5).fill(false);n=count=0;draw()}function draw(){let z='';for(let i=0;i<5;i++){let y=35+i*64;z+='<path d="M60 '+y+'H280" stroke="'+(g[i]?'#65dfc3':'#567a91')+'" stroke-width="'+(g[i]?4:1)+'"/>';for(let j of [i,i+5]){let u=j<5?60:280;z+='<circle cx="'+u+'" cy="'+y+'" r="'+(12+26*Math.abs(x[j]))+'" fill="'+(j<5?'#ed9439':'#9276e2')+'"/><text x="'+u+'" y="'+(y+4)+'" text-anchor="middle" fill="white" font-size="11">'+x[j].toFixed(3)+'</text>'}}e('v').innerHTML=z+'<circle cx="170" cy="165" r="28" fill="#367f86"/><text x="170" y="170" fill="white" text-anchor="middle">{{i}}</text>';e('o').textContent='Step '+n+' | retained '+(100*(x[0]**2+x[5]**2)).toFixed(4)+'% | norm² '+x.reduce((a,b)=>a+b*b,0).toFixed(9)+' | derivative uses '+count}e('policy').onchange=reset;reset()</script></html>
